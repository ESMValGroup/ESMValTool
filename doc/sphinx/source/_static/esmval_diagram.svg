  <title id="esv-svg-title">ESMValTool and ESMValCore documentation overview</title>
  <desc id="esv-svg-desc">ESMValTool contains Core, available recipes, diagnostic scripts, obtaining input data and observation data formatting. Core connects to ESMValCore: configuration, recipe format overview, preprocessor functions, data fix and native data, and variable derivation.</desc>

  <style>
