    .esv text { font-family: Arial, Helvetica, sans-serif; font-weight: bold; font-size: 15px; }
    .esv .esv-title { fill: #000000; font-size: 16px; }
    .esv .esv-item  { fill: #ffffff; }
    .esv .esv-core  { fill: #ffffff; }
    .esv .esv-hit   { fill: transparent; }
    .esv a { cursor: pointer; }
    .esv a:hover text { text-decoration: underline; }
    .esv a:hover .esv-item { fill: #ffff00; }
  </style>

