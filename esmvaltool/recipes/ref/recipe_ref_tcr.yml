# ESMValTool
---
documentation:
  title: >
    Transient Climate Response (TCR)
  description: >
    Calculate Transient Climate Response (TCR).
  authors:
    - schlund_manuel
  maintainer:
    - schlund_manuel
  references:
    - gregory08jgr


datasets:
  - {project: CMIP7, dataset: ACCESS-ESM1-6, mip: atmos, frequency: mon, region: glb, exp: piControl,
     ensemble: r1i1p1f1, grid: g115, institute: ACCESS-Consortium, timerange: 0201/0340, drs_specs: MIP-DRS7}
  - {project: CMIP7, dataset: ACCESS-ESM1-6, mip: atmos, frequency: mon, region: glb, exp: 1pctCO2,
     ensemble: r1i1p1f1, grid: g115, institute: ACCESS-Consortium, timerange: 0201/0340, drs_specs: MIP-DRS7}


preprocessors:
  spatial_mean:
    area_statistics:
      operator: mean


diagnostics:
  tcr:
    description: Calculate TCR.
    variables:
      tas:
        branding_suffix: tavg-h2m-hxy-u
        preprocessor: spatial_mean
    scripts:
      calculate:
        script: climate_metrics/tcr.py
        calculate_mmm: false
