# ESMValTool
# recipe_ref_zec_cmip7.yml
---
documentation:
  title: >
    Zero Emissions Commitment (ZEC) for CMIP7.

  description: >
    Calculate Zero Emission Commitment (ZEC) temperature.

  authors:
    - gier_bettina
  maintainer:
    - gier_bettina
  references:
    - macdougall20
  domains:
    - global
  realms:
    - atmos

preprocessors:

  spatial_mean:
    area_statistics:
      operator: mean
    annual_statistics:
      operator: mean

  anomaly_base:
    area_statistics:
      operator: mean
    climate_statistics:
      operator: mean
      period: full


diagnostics:

  zec:
    description: Calculate ZEC for all available models.
    variables:
      tas_base:
        short_name: tas
        preprocessor: anomaly_base
        exp: esm-flat10
        project: CMIP7
        grid: g120
        activity: C4MIP
        institute: CCCma
        mip: atmos
        frequency: mon
        region: glb
        branding_suffix: tavg-h2m-hxy-u
        drs_specs: MIP-DRS7
        additional_datasets:
          - {dataset: CanESM5-1, ensemble: r1i1p2f1, timerange: 1940/1959}
      tas:
        short_name: tas
        preprocessor: spatial_mean
        exp: esm-flat10-zec
        project: CMIP7
        grid: g120
        activity: C4MIP
        institute: CCCma
        mip: atmos
        frequency: mon
        region: glb
        branding_suffix: tavg-h2m-hxy-u
        drs_specs: MIP-DRS7
        additional_datasets:
          - {dataset: CanESM5-1, ensemble: r1i1p2f1, timerange: 1950/2049}
    scripts:
      zec:
        script: climate_metrics/zec.py
        zec_year: 50
