preprocessors:
  west_pole_abs_son:
    extract_region:
      start_longitude: 50
      end_longitude: 70
      start_latitude: -10
      end_latitude: 10
    area_statistics:
      operator: mean
    climate_statistics:
      operator: mean
      period: season
    extract_season:
      season: SON
    convert_units:
      units: celsius    
  east_pole_abs_son:
    extract_region:
      start_longitude: 80
      end_longitude: 100
      start_latitude: -10
      end_latitude: 0
    area_statistics:
      operator: mean
    climate_statistics:
      operator: mean
      period: season
    extract_season:
      season: SON
    convert_units:
      units: celsius  
  east_pole_anomalies_son:
    extract_region:
      start_longitude: 80
      end_longitude: 100
      start_latitude: -10
      end_latitude: 0
    anomalies:
      period: month
      reference:
        start_year: 1990
        start_month: 1
        start_day: 1
        end_year: 2010
        end_month: 12
        end_day: 31
      standardize: false    
    area_statistics:
      operator: mean
    extract_season:
      season: SON
  west_pole_anomalies_son:
    extract_region:
      start_longitude: 50
      end_longitude: 70
      start_latitude: -10
      end_latitude: 10
    anomalies:
      period: month
      reference:
        start_year: 1990
        start_month: 1
        start_day: 1
        end_year: 2010
        end_month: 12
        end_day: 31
      standardize: false    
    area_statistics:
      operator: mean
    extract_season:
      season: SON
  east_pole_timeseries:
    extract_region:
      start_longitude: 80
      end_longitude: 100
      start_latitude: -10
      end_latitude: 0
    area_statistics:
      operator: mean
    extract_season:
      season: SON
    convert_units:
      units: celsius    
  west_pole_3d_son:
    extract_region:
      start_longitude: 50
      end_longitude: 70
      start_latitude: -10
      end_latitude: 10
    extract_volume:
      z_min: 0.
      z_max: 200.
      interval_bounds: 'closed'
    climate_statistics:
      operator: mean
      period: season
    extract_season:
      season: SON
    convert_units:
      units: celsius    
  east_pole_3d_son:
    extract_region:
      start_longitude: 80
      end_longitude: 100
      start_latitude: -10
      end_latitude: 0
    extract_volume:
      z_min: 0.
      z_max: 200.
      interval_bounds: 'closed'
    climate_statistics:
      operator: mean
      period: season
    extract_season:
      season: SON
    convert_units:
      units: celsius   
  extract_ceio_son:
    extract_region:
      start_longitude: 70
      end_longitude: 90
      start_latitude: -5
      end_latitude: 5
    extract_levels:
      levels: [100000.]
      scheme: linear
    area_statistics:
      operator: mean
    climate_statistics:
      operator: mean
      period: season
    extract_season:
      season: SON
  extract_sctr_region:
    extract_region:
      start_longitude: 50
      end_longitude: 70
      start_latitude: -10
      end_latitude: -5
    extract_volume:
      z_min: 0.
      z_max: 200.
      interval_bounds: 'closed'
    convert_units:
      units: celsius
    climate_statistics:
      operator: mean
      period: season
    extract_season:
      season: SON


diagnostics:
  cmip_scatter:
    variables:
      west_ssts:
        short_name: tos
        mip: Omon
        preprocessor: west_pole_abs_son
        additional_datasets:
          - {dataset: HadISST, project: OBS, mip: Omon, type: reanaly, version: 1, tier: 2, start_year: 1990, end_year: 2010}
      east_ssts:
        short_name: tos
        mip: Omon
        preprocessor: east_pole_abs_son
        additional_datasets:
          - {dataset: HadISST, project: OBS, mip: Omon, type: reanaly, version: 1, tier: 2, start_year: 1990, end_year: 2010}
      east_ssts_ts:
        short_name: tos
        mip: Omon
        preprocessor: east_pole_timeseries
        additional_datasets:
          - {dataset: HadISST, project: OBS, mip: Omon, type: reanaly, version: 1, tier: 2, start_year: 1990, end_year: 2010}
      west_temps:
        short_name: thetao
        mip: Omon
        preprocessor: west_pole_3d_son
        additional_datasets:
          - {dataset: EN4, project: OBS6, mip: Omon, type: reanaly, version: 4.2.2, tier: 2, start_year: 1990, end_year: 2010}
      east_temps:
        short_name: thetao
        mip: Omon
        preprocessor: east_pole_3d_son
        additional_datasets:
          - {dataset: EN4, project: OBS6, mip: Omon, type: reanaly, version: 4.2.2, tier: 2, start_year: 1990, end_year: 2010}
      eq_winds:
        short_name: ua
        mip: Amon
        supplementary_variables:
        - short_name: areacella
          skip: true
        preprocessor: extract_ceio_son
        additional_datasets:
          - {dataset: NCEP, project: OBS, mip: Amon, start_year: 1990, end_year: 2010, type: reanaly, version: 1, tier: 2}
      sctr_temps:
        short_name: thetao
        mip: Omon
        preprocessor: extract_sctr_region
        additional_datasets:
          - {dataset: EN4, project: OBS6, mip: Omon, type: reanaly, version: 4.2.2, tier: 2, start_year: 1990, end_year: 2010}
      east_anoms:
        short_name: tos
        mip: Omon
        preprocessor: east_pole_anomalies_son
        additional_datasets:
          - {dataset: HadISST, project: OBS, mip: Omon, type: reanaly, version: 1, tier: 2, start_year: 1990, end_year: 2010}
      west_anoms:
        short_name: tos
        mip: Omon
        preprocessor: west_pole_anomalies_son
        additional_datasets:
          - {dataset: HadISST, project: OBS, mip: Omon, type: reanaly, version: 1, tier: 2, start_year: 1990, end_year: 2010}

    
    scripts: 
      iod_script:
        script: /home/users/hannah.ellis/esmvaltool_recipes/diag_scripts/tilt_scatter.py
