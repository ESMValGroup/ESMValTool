      end_longitude: 39.0
      start_latitude: 30.0
      end_latitude: 76.25
    area_statistics:
      operator: mean
    anomalies:
      period: full
      reference: &reference_period
        start_year: 1986
        start_month: 1
        start_day: 1
        end_year: 2015
        end_month: 12
        end_day: 31
      standardize: false
    extract_time:  # Future period
      start_year: 2035
      start_month: 1
      start_day: 1
      end_year: 2065
      end_month: 12
      end_day: 31
    climate_statistics:
      operator: mean

  prepare_for_bias_calculation:
    regrid:
      scheme: area_weighted
      target_grid: 2.5x2.5
    extract_region:
      <<: *region
    extract_time:
      <<: *reference_period
    regrid_time:
      frequency: mon
      calendar: standard
    distance_metric:
      metric: weighted_rmse
      coords: [time, latitude, longitude]
      keep_reference_dataset: false

diagnostics:
  bias_and_change:
    description: >
      Provide quick insights into the behaviour of each model by plotting the
      bias with respect to observations and change with respect to the reference
      period.

    themes:
      - phys
    realms:
      - atmos

    variables:
      tas_change: &change
        short_name: tas
        mip: Amon
        project: CMIP6
        timerange: '1986/2065'
        preprocessor: calculate_anomalies
      pr_change:
        <<: *change
        short_name: pr
      tas_bias: &bias
        short_name: tas
        mip: Amon
        project: CMIP6
        timerange: '1986/2015'
        preprocessor: prepare_for_bias_calculation
        additional_datasets:
          - {dataset: ERA-5, project: obs4MIPs, reference_for_metric: true}
      pr_bias:
        <<: *bias
        short_name: pr
        additional_datasets:
          - {dataset: ERA5, project: native6, type: reanaly, version: v1, tier: 3, reference_for_metric: true}

    scripts:
      visualize:
        script: impact/bias_and_change.py
        notes:
          - Bias is calculated with respect to the ERA5 reanalysis dataset over the period 1986-2015.
          - Future change is calculated for 2035-2065 as compared to 1986-2015.
          - Area is set to Europe (lon 0-39; lat 30-76.25).
          - Data are taken from the SSP scenarios, concatenated with the historical experiment.
          - Data from the emission-driven SSP5-8.5 scenario (esm-ssp585) are concatenated with the esm-hist experiment.
        axis_titles:
          bias: Bias with respect to ERA5 (1986-2015)
          change: Projected change (2050 versus 2000)
        alias_facets:
          project: project
          dataset: model
          exp: experiment
          ensemble: member
