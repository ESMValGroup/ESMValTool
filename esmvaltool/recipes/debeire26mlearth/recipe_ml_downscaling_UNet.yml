# ESMValTool
# recipe_ml_downscaling_UNet.yml
#
# Deterministic UNet-MSE baseline.
# `UNet-MSE` is a fresh SongUNet of the same capacity as $E_\psi$ trained
# from scratch with MSE only. Positional embeddings disabled (matches
# AFM-baseline / PCAFM so only the training objective differs).
#
# Multi-region: CE, IBE, SCA via the `version` facet. UNet-MSE is
# deterministic so only `version: 1[-region]` is provided per region.
---
documentation:
  description: |
    UNet-MSE non-generative baseline vs AFM-baseline / PCAFM over
    CE, IBE, SCA.
  authors:
    - debeire_kevin
  title: UNet-MSE baseline
  maintainer:
    - debeire_kevin

