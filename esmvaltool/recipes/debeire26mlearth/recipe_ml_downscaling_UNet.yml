preprocessors:
  pp_extract_time: &pp_time
    extract_time:
      start_day: 20
      start_month: 01
      start_year: 2024
      end_day: 18
      end_month: 01
      end_year: 2025
  pp_tas:   {<<: *pp_time, convert_units: {units: degC}}
  pp_huss:  {<<: *pp_time, convert_units: {units: g kg-1}}
  pp_pr:    {<<: *pp_time, convert_units: {units: mm h-1}}
  pp_ps:    {<<: *pp_time, convert_units: {units: hPa}}
  pp_qmae_tas:  {<<: *pp_time, extract_season: {season: "JJA"}, convert_units: {units: degC}}
  pp_qmae_huss: {<<: *pp_time, extract_season: {season: "JJA"}, convert_units: {units: g kg-1}}
  pp_qmae_ps:   {<<: *pp_time, extract_season: {season: "JJA"}, convert_units: {units: hPa}}
  pp_qmae_pr:   {<<: *pp_time, extract_season: {season: "DJF"}, convert_units: {units: mm h-1}}
  pp_qmae_uas:  {<<: *pp_time, extract_season: {season: "SON"}}
  pp_qmae_vas:  {<<: *pp_time, extract_season: {season: "SON"}}

_script_opts:
  ml_methods: &_ml ["AFM-baseline", "PCAFM", "UNet-MSE"]

diagnostics:

  # =====================================================================
  # CE
  # =====================================================================
  UNet_eval_CE:
    description: "UNet-MSE baseline — CE"
    variables:
      uas:  {preprocessor: pp_extract_time, additional_datasets: *CE_datasets}
      vas:  {preprocessor: pp_extract_time, additional_datasets: *CE_datasets}
      huss: {preprocessor: pp_huss,         additional_datasets: *CE_datasets}
      ps:   {preprocessor: pp_ps,           additional_datasets: *CE_datasets}
      pr:   {preprocessor: pp_pr,           additional_datasets: *CE_datasets}
      tas:  {preprocessor: pp_tas,          additional_datasets: *CE_datasets}
    scripts:
      spatial_metrics: &spatial_metrics_cfg
        script: regional_downscaling/ml_downscaling_evaluation.py
        ml_methods: *_ml
        reference: HIGHRES-REF
        analysis_type: spatial_metrics
        compute_relbias_pr: true
        compute_conservation: ["pr", "huss"]
        pool_factor: 10
      energy_spectrum: &spec_cfg
        script: regional_downscaling/ml_downscaling_evaluation.py
        ml_methods: *_ml
        reference: HIGHRES-REF
        analysis_type: energy_spectrum
      log_density: &logd_cfg
        script: regional_downscaling/ml_downscaling_evaluation.py
        ml_methods: *_ml
        reference: HIGHRES-REF
        analysis_type: log_density
      calibration: &cal_cfg
        script: regional_downscaling/ml_downscaling_evaluation.py
        ml_methods: *_ml
        reference: HIGHRES-REF
        analysis_type: calibration

  UNet_quantileMAE_CE:
    description: "UNet-MSE — Quantile MAE — CE"
    variables:
      uas:  {preprocessor: pp_qmae_uas,  additional_datasets: *CE_datasets}
      vas:  {preprocessor: pp_qmae_vas,  additional_datasets: *CE_datasets}
      huss: {preprocessor: pp_qmae_huss, additional_datasets: *CE_datasets}
      ps:   {preprocessor: pp_qmae_ps,   additional_datasets: *CE_datasets}
      pr:   {preprocessor: pp_qmae_pr,   additional_datasets: *CE_datasets}
      tas:  {preprocessor: pp_qmae_tas,  additional_datasets: *CE_datasets}
    scripts:
      quantile_MAE: &qmae_cfg
        script: regional_downscaling/ml_downscaling_evaluation.py
        ml_methods: *_ml
        reference: HIGHRES-REF
        analysis_type: quantile_MAE
        compute_wbgt: true
        compute_wind: true
        compute_pr: true

  UNet_heatmap_CE:
    description: "UNet-MSE heatmap — CE (vs AFM-baseline)"
    scripts:
      heatmap:
        script: regional_downscaling/ml_downscaling_heatmap.py
        ancestors:
          - 'UNet_eval_CE/spatial_metrics'
          - 'UNet_eval_CE/energy_spectrum'
          - 'UNet_eval_CE/log_density'
          - 'UNet_eval_CE/calibration'
          - 'UNet_quantileMAE_CE/quantile_MAE'
        method1: "UNet-MSE"
        method2: "AFM-baseline"
        region_name: "UNet-MSE baseline — CE"
        heatmap_vmin: 0.60
        heatmap_vmax: 1.40

  # =====================================================================
  # IBE
  # =====================================================================
  UNet_eval_IBE:
    description: "UNet-MSE baseline — IBE"
    variables:
      uas:  {preprocessor: pp_extract_time, additional_datasets: *IBE_datasets}
      vas:  {preprocessor: pp_extract_time, additional_datasets: *IBE_datasets}
      huss: {preprocessor: pp_huss,         additional_datasets: *IBE_datasets}
      ps:   {preprocessor: pp_ps,           additional_datasets: *IBE_datasets}
      pr:   {preprocessor: pp_pr,           additional_datasets: *IBE_datasets}
      tas:  {preprocessor: pp_tas,          additional_datasets: *IBE_datasets}
    scripts:
      spatial_metrics: *spatial_metrics_cfg
      energy_spectrum: *spec_cfg
      log_density:     *logd_cfg
      calibration:     *cal_cfg

  UNet_quantileMAE_IBE:
    description: "UNet-MSE — Quantile MAE — IBE"
    variables:
      uas:  {preprocessor: pp_qmae_uas,  additional_datasets: *IBE_datasets}
      vas:  {preprocessor: pp_qmae_vas,  additional_datasets: *IBE_datasets}
      huss: {preprocessor: pp_qmae_huss, additional_datasets: *IBE_datasets}
      ps:   {preprocessor: pp_qmae_ps,   additional_datasets: *IBE_datasets}
      pr:   {preprocessor: pp_qmae_pr,   additional_datasets: *IBE_datasets}
      tas:  {preprocessor: pp_qmae_tas,  additional_datasets: *IBE_datasets}
    scripts:
      quantile_MAE: *qmae_cfg

  UNet_heatmap_IBE:
    description: "UNet-MSE heatmap — IBE (vs AFM-baseline)"
    scripts:
      heatmap:
        script: regional_downscaling/ml_downscaling_heatmap.py
        ancestors:
          - 'UNet_eval_IBE/spatial_metrics'
          - 'UNet_eval_IBE/energy_spectrum'
          - 'UNet_eval_IBE/log_density'
          - 'UNet_eval_IBE/calibration'
          - 'UNet_quantileMAE_IBE/quantile_MAE'
        method1: "UNet-MSE"
        method2: "AFM-baseline"
        region_name: "UNet-MSE baseline — IBE"
        heatmap_vmin: 0.60
        heatmap_vmax: 1.40

  # =====================================================================
  # SCA
  # =====================================================================
  UNet_eval_SCA:
    description: "UNet-MSE baseline — SCA"
    variables:
      uas:  {preprocessor: pp_extract_time, additional_datasets: *SCA_datasets}
      vas:  {preprocessor: pp_extract_time, additional_datasets: *SCA_datasets}
      huss: {preprocessor: pp_huss,         additional_datasets: *SCA_datasets}
      ps:   {preprocessor: pp_ps,           additional_datasets: *SCA_datasets}
      pr:   {preprocessor: pp_pr,           additional_datasets: *SCA_datasets}
      tas:  {preprocessor: pp_tas,          additional_datasets: *SCA_datasets}
    scripts:
      spatial_metrics: *spatial_metrics_cfg
      energy_spectrum: *spec_cfg
      log_density:     *logd_cfg
      calibration:     *cal_cfg

  UNet_quantileMAE_SCA:
    description: "UNet-MSE — Quantile MAE — SCA"
    variables:
      uas:  {preprocessor: pp_qmae_uas,  additional_datasets: *SCA_datasets}
      vas:  {preprocessor: pp_qmae_vas,  additional_datasets: *SCA_datasets}
      huss: {preprocessor: pp_qmae_huss, additional_datasets: *SCA_datasets}
      ps:   {preprocessor: pp_qmae_ps,   additional_datasets: *SCA_datasets}
      pr:   {preprocessor: pp_qmae_pr,   additional_datasets: *SCA_datasets}
      tas:  {preprocessor: pp_qmae_tas,  additional_datasets: *SCA_datasets}
    scripts:
