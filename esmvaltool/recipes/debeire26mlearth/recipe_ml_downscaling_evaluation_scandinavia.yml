diagnostics:
  downscaling_evaluation_6M:
    description: "ML-based downscaling vs HIGHRES-REF"
    variables:
      uas:
        preprocessor: preproc_extract_time
      vas:
        preprocessor: preproc_extract_time
      huss:
        preprocessor: preproc_convert_huss
      ps:
        preprocessor: preproc_convert_ps
      pr:
        preprocessor: preproc_convert_pr
      tas:
        preprocessor: preproc_convert_tas
    scripts:
      spatial_metrics: #calculates bias (relative bias for "pr"), crps, spatial correlation and variance ratio of "reference vs. downscaled fields"
        script: regional_downscaling/ml_downscaling_evaluation.py
        ml_methods: ["AFM-baseline","PCAFM"] # ["CorrDiff","AFM-baseline", "AFM-baseline", "AFM-baseline-8M","PCAFM","PCAFM"] #"PCAFM-Standard","PCAFM-Standard-PLW10","PCAFM-ConFIG","PCAFM-ConFIG-2"] #,"PCAFM-ConFIG-DW","PCAFM","PCAFM-ConFIG-DW-Splitloss"]
        reference: HIGHRES-REF-Scandinavia
        analysis_type: spatial_metrics
        compute_relbias_pr: true  # Set to false for arid regions with very low pr (like Sahara)
        compute_conservation: ["pr", "huss"]  # Variables for conservation error
        pool_factor: 10  # Coarsening factor to calculate conservation error (10x10 grid cells)
      energy_spectrum: #plot energy spectrum of "reference vs. downscaled fields"
        script: regional_downscaling/ml_downscaling_evaluation.py
        ml_methods: ["AFM-baseline","PCAFM"]
        reference: HIGHRES-REF-Scandinavia
        analysis_type: energy_spectrum
      log_density: #plot log probability density of "reference vs. downscaled fields"
        script: regional_downscaling/ml_downscaling_evaluation.py
        ml_methods: ["AFM-baseline","PCAFM"]
        reference: HIGHRES-REF-Scandinavia
        analysis_type: log_density
      # temporal_structure: #calculate error between ACF at lag -1
      #   script: regional_downscaling/ml_downscaling_evaluation.py
      #   ml_methods: ["AFM-baseline","PCAFM"]
      #   reference: HIGHRES-REF-Scandinavia
      #   analysis_type: temporal_structure
      calibration: #rank histogram and MCB (miscalibration) for ensemble calibration evaluation
        script: regional_downscaling/ml_downscaling_evaluation.py
        ml_methods: ["AFM-baseline","PCAFM"]
        reference: HIGHRES-REF-Scandinavia
        analysis_type: calibration
      create_animation: #creates a animation of "reference vs. downscaled fields" snapshots per snapshots
        script: regional_downscaling/ml_downscaling_evaluation.py
        ml_methods: ["AFM-baseline","PCAFM"]
        reference: HIGHRES-REF-Scandinavia
        analysis_type: create_animation
        animation_start_time: 800           # Start time index (800)
        animation_end_time: 810            # End time index (810)
        animation_frame_duration: 2     # Seconds to pause on each frame

  quantileMAE_6M:
    description: "ML-based downscaling vs HIGHRES-REF"
    variables:
      uas:
        preprocessor: preproc_quantileMAE_uas
      vas:
        preprocessor: preproc_quantileMAE_vas
      huss:
        preprocessor: preproc_quantileMAE_huss
      ps:
        preprocessor: preproc_quantileMAE_ps
      pr:
        preprocessor: preproc_quantileMAE_pr
      tas:
        preprocessor: preproc_quantileMAE_tas
    scripts:
      quantile_MAE: #plot MAE between quantiles of "reference vs. downscaled fields"
        script: regional_downscaling/ml_downscaling_evaluation.py
        ml_methods: ["AFM-baseline","PCAFM"]
        reference: HIGHRES-REF-Scandinavia
        analysis_type: quantile_MAE
        compute_wbgt: true  # Set to true if computing Summer WBGT (wet bulb global temperature) from tas, huss, ps
        compute_wind: true  # Set to true if computing Fall wind speed from uas, vas
        compute_pr: true # Set to true if computing Winter precipitation

  relative_performance_heatmap_6M:
    description: "Relative performance heatmap comparing two ML downscaling methods"
    scripts:
      heatmap:
        script: regional_downscaling/ml_downscaling_heatmap.py
        ancestors: ['downscaling_evaluation_6M/spatial_metrics', 'downscaling_evaluation_6M/energy_spectrum', 'downscaling_evaluation_6M/log_density', 'downscaling_evaluation_6M/calibration', 'quantileMAE_6M/quantile_MAE'] #'downscaling_evaluation/temporal_structure'
        method1: "PCAFM"           # Numerator method (change as needed)
        method2: "AFM-baseline"    # Denominator method (change as needed)
        region_name: "Northern Europe region (unseen during training)" #used as Supertitle
        heatmap_vmin: 0.80         # Minimum value for colormap
        heatmap_vmax: 1.20         # Maximum value for colormap

  combined_panel_6M:
    description: "Combined evaluation panel (spatial metrics + energy spectrum + log PDF + calibration) per variable"
    scripts:
      panel:
        script: regional_downscaling/ml_downscaling_combined_panel.py
        ancestors: ['downscaling_evaluation_6M/spatial_metrics', 'downscaling_evaluation_6M/energy_spectrum', 'downscaling_evaluation_6M/log_density', 'downscaling_evaluation_6M/calibration']
        variables: ["pr", "huss", "tas", "ps", "uas", "vas"]
        panel_fig_width: 18        # Figure width in inches
        region_name: "Northern Europe region (unseen during training)" #used as Supertitle