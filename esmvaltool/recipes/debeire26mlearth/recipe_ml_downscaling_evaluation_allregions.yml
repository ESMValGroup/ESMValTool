# -----------------------------------------------------------------------------
# Preprocessors  (anchors -> per-region merges)
# -----------------------------------------------------------------------------
preprocessors:
  # -- CE preprocessors (no clip) --
  pp_time_CE: &pp_time_CE
    extract_time: &time_window
      start_day: 20
      start_month: 01
      start_year: 2024
      end_day: 18
      end_month: 01
      end_year: 2025
  pp_tas_CE:  {<<: *pp_time_CE, convert_units: {units: degC}}
  pp_huss_CE: {<<: *pp_time_CE, convert_units: {units: g kg-1}}
  pp_pr_CE:   {<<: *pp_time_CE, convert_units: {units: mm h-1}}
  pp_ps_CE:   {<<: *pp_time_CE, convert_units: {units: hPa}}

  pp_qmae_tas_CE:  {<<: *pp_time_CE, extract_season: {season: "JJA"}, convert_units: {units: degC}}
  pp_qmae_huss_CE: {<<: *pp_time_CE, extract_season: {season: "JJA"}, convert_units: {units: g kg-1}}
  pp_qmae_pr_CE:   {<<: *pp_time_CE, extract_season: {season: "DJF"}, convert_units: {units: mm h-1}}
  pp_qmae_ps_CE:   {<<: *pp_time_CE, extract_season: {season: "JJA"}, convert_units: {units: hPa}}
  pp_qmae_uas_CE:  {<<: *pp_time_CE, extract_season: {season: "SON"}}
  pp_qmae_vas_CE:  {<<: *pp_time_CE, extract_season: {season: "SON"}}

  # -- IBE preprocessors (clip to lon -15..3, lat 24..42) --
  pp_time_IBE: &pp_time_IBE
    extract_time: *time_window
    extract_region: &ibe_clip
      start_longitude: -15
      end_longitude: 3
      start_latitude: 24
      end_latitude: 42
  pp_tas_IBE:  {<<: *pp_time_IBE, convert_units: {units: degC}}
  pp_huss_IBE: {<<: *pp_time_IBE, convert_units: {units: g kg-1}}
  pp_pr_IBE:   {<<: *pp_time_IBE, convert_units: {units: mm h-1}}
  pp_ps_IBE:   {<<: *pp_time_IBE, convert_units: {units: hPa}}

  pp_qmae_tas_IBE:  {<<: *pp_time_IBE, extract_season: {season: "JJA"}, convert_units: {units: degC}}
  pp_qmae_huss_IBE: {<<: *pp_time_IBE, extract_season: {season: "JJA"}, convert_units: {units: g kg-1}}
  pp_qmae_pr_IBE:   {<<: *pp_time_IBE, extract_season: {season: "DJF"}, convert_units: {units: mm h-1}}
  pp_qmae_ps_IBE:   {<<: *pp_time_IBE, extract_season: {season: "JJA"}, convert_units: {units: hPa}}
  pp_qmae_uas_IBE:  {<<: *pp_time_IBE, extract_season: {season: "SON"}}
  pp_qmae_vas_IBE:  {<<: *pp_time_IBE, extract_season: {season: "SON"}}

  # -- SCA preprocessors (no clip) --
  pp_time_SCA: &pp_time_SCA
    extract_time: *time_window
  pp_tas_SCA:  {<<: *pp_time_SCA, convert_units: {units: degC}}
  pp_huss_SCA: {<<: *pp_time_SCA, convert_units: {units: g kg-1}}
  pp_pr_SCA:   {<<: *pp_time_SCA, convert_units: {units: mm h-1}}
  pp_ps_SCA:   {<<: *pp_time_SCA, convert_units: {units: hPa}}

  pp_qmae_tas_SCA:  {<<: *pp_time_SCA, extract_season: {season: "JJA"}, convert_units: {units: degC}}
  pp_qmae_huss_SCA: {<<: *pp_time_SCA, extract_season: {season: "JJA"}, convert_units: {units: g kg-1}}
  pp_qmae_pr_SCA:   {<<: *pp_time_SCA, extract_season: {season: "DJF"}, convert_units: {units: mm h-1}}
  pp_qmae_ps_SCA:   {<<: *pp_time_SCA, extract_season: {season: "JJA"}, convert_units: {units: hPa}}
  pp_qmae_uas_SCA:  {<<: *pp_time_SCA, extract_season: {season: "SON"}}
  pp_qmae_vas_SCA:  {<<: *pp_time_SCA, extract_season: {season: "SON"}}


# -----------------------------------------------------------------------------
# Diagnostics
# -----------------------------------------------------------------------------
#
# YAML anchors for shared script content (constant across regions).  Region-
# specific overrides (reference, region_name, compute_relbias_pr) are applied
# via per-diagnostic merge keys + scalar overrides.
diagnostics:

  # =========================================================================
  # ===== CENTRAL EUROPE (training region) ==================================
  # =========================================================================
  downscaling_evaluation_6M_CE:
    description: "ML-based downscaling vs HIGHRES-REF (Central Europe)"
    variables:
      uas:  {preprocessor: pp_time_CE, additional_datasets: *CE_datasets}
      vas:  {preprocessor: pp_time_CE, additional_datasets: *CE_datasets}
      huss: {preprocessor: pp_huss_CE, additional_datasets: *CE_datasets}
      ps:   {preprocessor: pp_ps_CE,   additional_datasets: *CE_datasets}
      pr:   {preprocessor: pp_pr_CE,   additional_datasets: *CE_datasets}
      tas:  {preprocessor: pp_tas_CE,  additional_datasets: *CE_datasets}
    scripts:
      spatial_metrics:
        script: regional_downscaling/ml_downscaling_evaluation.py
        ml_methods: ["AFM-baseline", "PCAFM", "UNet"]
        reference: HIGHRES-REF
        analysis_type: spatial_metrics
        compute_relbias_pr: true
        compute_conservation: ["pr", "huss"]
        pool_factor: 10
      energy_spectrum:
        script: regional_downscaling/ml_downscaling_evaluation.py
        ml_methods: ["AFM-baseline", "PCAFM", "UNet"]
        reference: HIGHRES-REF
        analysis_type: energy_spectrum
      log_density:
        script: regional_downscaling/ml_downscaling_evaluation.py
        ml_methods: ["AFM-baseline", "PCAFM", "UNet"]
        reference: HIGHRES-REF
        analysis_type: log_density
      calibration:
        script: regional_downscaling/ml_downscaling_evaluation.py
        ml_methods: ["AFM-baseline", "PCAFM"]   # ensemble-only -- rank hist + MCB
        reference: HIGHRES-REF
        analysis_type: calibration
      create_animation:
        script: regional_downscaling/ml_downscaling_evaluation.py
        ml_methods: ["AFM-baseline", "PCAFM", "UNet"]
        reference: HIGHRES-REF
        analysis_type: create_animation
        animation_start_time: 800
        animation_end_time: 810
        animation_frame_duration: 2

  quantileMAE_6M_CE:
    description: "Quantile MAE vs HIGHRES-REF (Central Europe)"
    variables:
      uas:  {preprocessor: pp_qmae_uas_CE,  additional_datasets: *CE_datasets}
      vas:  {preprocessor: pp_qmae_vas_CE,  additional_datasets: *CE_datasets}
      huss: {preprocessor: pp_qmae_huss_CE, additional_datasets: *CE_datasets}
      ps:   {preprocessor: pp_qmae_ps_CE,   additional_datasets: *CE_datasets}
      pr:   {preprocessor: pp_qmae_pr_CE,   additional_datasets: *CE_datasets}
      tas:  {preprocessor: pp_qmae_tas_CE,  additional_datasets: *CE_datasets}
    scripts:
      quantile_MAE:
        script: regional_downscaling/ml_downscaling_evaluation.py
        ml_methods: ["AFM-baseline", "PCAFM", "UNet"]
        reference: HIGHRES-REF
        analysis_type: quantile_MAE
        compute_wbgt: true
        compute_wind: true
        compute_pr: true

  relative_performance_heatmap_6M_CE:
    description: "Relative performance heatmap (Central Europe)"
    scripts:
      heatmap:
        script: regional_downscaling/ml_downscaling_heatmap.py
        ancestors:
          - 'downscaling_evaluation_6M_CE/spatial_metrics'
          - 'downscaling_evaluation_6M_CE/energy_spectrum'
          - 'downscaling_evaluation_6M_CE/log_density'
          - 'downscaling_evaluation_6M_CE/calibration'
          - 'quantileMAE_6M_CE/quantile_MAE'
        method1: "PCAFM"
        method2: "AFM-baseline"
        region_name: "Central Europe (training region)"
        heatmap_vmin: 0.80
        heatmap_vmax: 1.20

  combined_panel_6M_CE:
    description: "Combined evaluation panel (Central Europe)"
    scripts:
      panel:
        script: regional_downscaling/ml_downscaling_combined_panel.py
        ancestors:
          - 'downscaling_evaluation_6M_CE/spatial_metrics'
          - 'downscaling_evaluation_6M_CE/energy_spectrum'
          - 'downscaling_evaluation_6M_CE/log_density'
          - 'downscaling_evaluation_6M_CE/calibration'
        variables: ["pr", "huss", "tas", "ps", "uas", "vas"]
        panel_fig_width: 18
        region_name: "Central Europe (training region)"

  # =========================================================================
  # ===== IBERIA (OOD, arid) ================================================
  # =========================================================================
  downscaling_evaluation_6M_IBE:
    description: "ML-based downscaling vs HIGHRES-REF (Iberic Peninsula)"
    variables:
      uas:  {preprocessor: pp_time_IBE, additional_datasets: *IBE_datasets}
      vas:  {preprocessor: pp_time_IBE, additional_datasets: *IBE_datasets}
      huss: {preprocessor: pp_huss_IBE, additional_datasets: *IBE_datasets}
      ps:   {preprocessor: pp_ps_IBE,   additional_datasets: *IBE_datasets}
      pr:   {preprocessor: pp_pr_IBE,   additional_datasets: *IBE_datasets}
      tas:  {preprocessor: pp_tas_IBE,  additional_datasets: *IBE_datasets}
    scripts:
      spatial_metrics:
        script: regional_downscaling/ml_downscaling_evaluation.py
        ml_methods: ["AFM-baseline", "PCAFM", "UNet"]
        reference: HIGHRES-REF-Iberia
        analysis_type: spatial_metrics
        compute_relbias_pr: false  # arid -- relative bias unstable
        compute_conservation: ["pr", "huss"]
        pool_factor: 10
      energy_spectrum:
        script: regional_downscaling/ml_downscaling_evaluation.py
        ml_methods: ["AFM-baseline", "PCAFM", "UNet"]
        reference: HIGHRES-REF-Iberia
        analysis_type: energy_spectrum
      log_density:
        script: regional_downscaling/ml_downscaling_evaluation.py
        ml_methods: ["AFM-baseline", "PCAFM", "UNet"]
        reference: HIGHRES-REF-Iberia
        analysis_type: log_density
      calibration:
        script: regional_downscaling/ml_downscaling_evaluation.py
        ml_methods: ["AFM-baseline", "PCAFM"]   # ensemble-only -- rank hist + MCB
        reference: HIGHRES-REF-Iberia
        analysis_type: calibration
      create_animation:
        script: regional_downscaling/ml_downscaling_evaluation.py
        ml_methods: ["AFM-baseline", "PCAFM", "UNet"]
        reference: HIGHRES-REF-Iberia
        analysis_type: create_animation
        animation_start_time: 800
        animation_end_time: 810
        animation_frame_duration: 2

  quantileMAE_6M_IBE:
    description: "Quantile MAE vs HIGHRES-REF (Iberic Peninsula)"
    variables:
      uas:  {preprocessor: pp_qmae_uas_IBE,  additional_datasets: *IBE_datasets}
      vas:  {preprocessor: pp_qmae_vas_IBE,  additional_datasets: *IBE_datasets}
      huss: {preprocessor: pp_qmae_huss_IBE, additional_datasets: *IBE_datasets}
      ps:   {preprocessor: pp_qmae_ps_IBE,   additional_datasets: *IBE_datasets}
      pr:   {preprocessor: pp_qmae_pr_IBE,   additional_datasets: *IBE_datasets}
      tas:  {preprocessor: pp_qmae_tas_IBE,  additional_datasets: *IBE_datasets}
    scripts:
      quantile_MAE:
        script: regional_downscaling/ml_downscaling_evaluation.py
