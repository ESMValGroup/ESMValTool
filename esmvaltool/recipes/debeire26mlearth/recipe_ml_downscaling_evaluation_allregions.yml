# ESMValTool
# recipe_ml_downscaling_evaluation_allregions.yml
#
# Single merged version of:
#   - recipe_ml_downscaling_evaluation.yml             (Central Europe, training)
#   - recipe_ml_downscaling_evaluation_iberia.yml      (Iberic Peninsula, OOD)
#   - recipe_ml_downscaling_evaluation_scandinavia.yml (Scandinavia, OOD)
#
# All three regions share most of the preprocessor logic (same time window,
# same unit conversions, same DJF/JJA/SON seasons for QMAE); only IBE needs a
# regional clip box and IBE has compute_relbias_pr=false (arid pr).
#
# Per-region deltas:
#   region | reference dataset        | version suffix  | extract_region    | relbias_pr
#   -------+--------------------------+-----------------+-------------------+-----------
#    CE    | HIGHRES-REF              | (none)          | (none)            | true
#    IBE   | HIGHRES-REF-Iberia       | -Iberia         | lon -15..3, lat 24..42 | false
#    SCA   | HIGHRES-REF-Scandinavia  | -Scandinavia    | (none)            | true
#
# The qmae_cross_region_6M block at the bottom takes the three per-region
# quantileMAE_6M_* runs as ancestors and writes the merged cross-region
# QMAE table.
---
documentation:
  description: |
    Evaluation of ML-based downscaling (AFM-baseline vs PCAFM) across three
    regions (Central Europe, Iberic Peninsula, Scandinavia) in a single run,
    including a cross-region QMAE summary.

  authors:
    - debeire_kevin

  title: Evaluation of ML-based downscaling (CE + IBE + SCA)

  maintainer:
    - debeire_kevin


# -----------------------------------------------------------------------------
