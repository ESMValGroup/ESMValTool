        compute_pr: true

  relative_performance_heatmap_6M_IBE:
    description: "Relative performance heatmap (Iberic Peninsula)"
    scripts:
      heatmap:
        script: regional_downscaling/ml_downscaling_heatmap.py
        ancestors:
          - 'downscaling_evaluation_6M_IBE/spatial_metrics'
          - 'downscaling_evaluation_6M_IBE/energy_spectrum'
          - 'downscaling_evaluation_6M_IBE/log_density'
          - 'downscaling_evaluation_6M_IBE/calibration'
          - 'quantileMAE_6M_IBE/quantile_MAE'
        method1: "PCAFM"
        method2: "AFM-baseline"
        region_name: "Iberic Peninsula (unseen during training)"
        heatmap_vmin: 0.80
        heatmap_vmax: 1.20

  combined_panel_6M_IBE:
    description: "Combined evaluation panel (Iberic Peninsula)"
    scripts:
      panel:
        script: regional_downscaling/ml_downscaling_combined_panel.py
        ancestors:
          - 'downscaling_evaluation_6M_IBE/spatial_metrics'
          - 'downscaling_evaluation_6M_IBE/energy_spectrum'
          - 'downscaling_evaluation_6M_IBE/log_density'
          - 'downscaling_evaluation_6M_IBE/calibration'
        variables: ["pr", "huss", "tas", "ps", "uas", "vas"]
        panel_fig_width: 18
        region_name: "Iberic Peninsula (unseen during training)"

  # =========================================================================
  # ===== SCANDINAVIA (OOD, wet) ============================================
  # =========================================================================
  downscaling_evaluation_6M_SCA:
    description: "ML-based downscaling vs HIGHRES-REF (Scandinavia)"
    variables:
      uas:  {preprocessor: pp_time_SCA, additional_datasets: *SCA_datasets}
      vas:  {preprocessor: pp_time_SCA, additional_datasets: *SCA_datasets}
      huss: {preprocessor: pp_huss_SCA, additional_datasets: *SCA_datasets}
      ps:   {preprocessor: pp_ps_SCA,   additional_datasets: *SCA_datasets}
      pr:   {preprocessor: pp_pr_SCA,   additional_datasets: *SCA_datasets}
      tas:  {preprocessor: pp_tas_SCA,  additional_datasets: *SCA_datasets}
    scripts:
      spatial_metrics:
        script: regional_downscaling/ml_downscaling_evaluation.py
        ml_methods: ["AFM-baseline", "PCAFM", "UNet"]
        reference: HIGHRES-REF-Scandinavia
        analysis_type: spatial_metrics
        compute_relbias_pr: true
        compute_conservation: ["pr", "huss"]
        pool_factor: 10
      energy_spectrum:
        script: regional_downscaling/ml_downscaling_evaluation.py
        ml_methods: ["AFM-baseline", "PCAFM", "UNet"]
        reference: HIGHRES-REF-Scandinavia
        analysis_type: energy_spectrum
      log_density:
        script: regional_downscaling/ml_downscaling_evaluation.py
        ml_methods: ["AFM-baseline", "PCAFM", "UNet"]
        reference: HIGHRES-REF-Scandinavia
        analysis_type: log_density
      calibration:
        script: regional_downscaling/ml_downscaling_evaluation.py
        ml_methods: ["AFM-baseline", "PCAFM"]   # ensemble-only -- rank hist + MCB
        reference: HIGHRES-REF-Scandinavia
        analysis_type: calibration
      create_animation:
        script: regional_downscaling/ml_downscaling_evaluation.py
        ml_methods: ["AFM-baseline", "PCAFM", "UNet"]
        reference: HIGHRES-REF-Scandinavia
        analysis_type: create_animation
        animation_start_time: 800
        animation_end_time: 810
        animation_frame_duration: 2

  quantileMAE_6M_SCA:
    description: "Quantile MAE vs HIGHRES-REF (Scandinavia)"
    variables:
      uas:  {preprocessor: pp_qmae_uas_SCA,  additional_datasets: *SCA_datasets}
      vas:  {preprocessor: pp_qmae_vas_SCA,  additional_datasets: *SCA_datasets}
      huss: {preprocessor: pp_qmae_huss_SCA, additional_datasets: *SCA_datasets}
      ps:   {preprocessor: pp_qmae_ps_SCA,   additional_datasets: *SCA_datasets}
      pr:   {preprocessor: pp_qmae_pr_SCA,   additional_datasets: *SCA_datasets}
      tas:  {preprocessor: pp_qmae_tas_SCA,  additional_datasets: *SCA_datasets}
    scripts:
      quantile_MAE:
        script: regional_downscaling/ml_downscaling_evaluation.py
        ml_methods: ["AFM-baseline", "PCAFM", "UNet"]
        reference: HIGHRES-REF-Scandinavia
        analysis_type: quantile_MAE
        compute_wbgt: true
        compute_wind: true
        compute_pr: true

  relative_performance_heatmap_6M_SCA:
    description: "Relative performance heatmap (Scandinavia)"
    scripts:
      heatmap:
        script: regional_downscaling/ml_downscaling_heatmap.py
        ancestors:
          - 'downscaling_evaluation_6M_SCA/spatial_metrics'
          - 'downscaling_evaluation_6M_SCA/energy_spectrum'
          - 'downscaling_evaluation_6M_SCA/log_density'
          - 'downscaling_evaluation_6M_SCA/calibration'
          - 'quantileMAE_6M_SCA/quantile_MAE'
        method1: "PCAFM"
        method2: "AFM-baseline"
        region_name: "Northern Europe region (unseen during training)"
        heatmap_vmin: 0.80
        heatmap_vmax: 1.20

  combined_panel_6M_SCA:
    description: "Combined evaluation panel (Scandinavia)"
    scripts:
      panel:
        script: regional_downscaling/ml_downscaling_combined_panel.py
        ancestors:
          - 'downscaling_evaluation_6M_SCA/spatial_metrics'
          - 'downscaling_evaluation_6M_SCA/energy_spectrum'
          - 'downscaling_evaluation_6M_SCA/log_density'
          - 'downscaling_evaluation_6M_SCA/calibration'
        variables: ["pr", "huss", "tas", "ps", "uas", "vas"]
        panel_fig_width: 18
        region_name: "Northern Europe region (unseen during training)"

  # =========================================================================
  # ===== CROSS-REGION QMAE SUMMARY ========================================
  # =========================================================================
  qmae_cross_region_6M:
    description: "Merged QMAE table across CE + IBE + SCA"
    scripts:
      qmae_cross_region:
        script: regional_downscaling/ml_downscaling_qmae_cross_region.py
        ancestors:
          - 'quantileMAE_6M_CE/quantile_MAE'
          - 'quantileMAE_6M_IBE/quantile_MAE'
          - 'quantileMAE_6M_SCA/quantile_MAE'
        # Maps each ancestor's diagnostic key to a region label that appears
        # in the merged table / heatmap.
        region_labels:
          quantileMAE_6M_CE:  "Central Europe"
          quantileMAE_6M_IBE: "Iberic Peninsula"
          quantileMAE_6M_SCA: "Scandinavia"
        # Methods to keep as columns (must match the per-region ml_methods).
        methods: ["AFM-baseline", "PCAFM", "UNet"]
        # Reference method used for ratios in the heatmap (PCAFM / method2).
        # The heatmap stays a PCAFM-vs-AFM-baseline pairwise ratio; UNet
        # values still appear in the merged CSV table as an extra column.
        method1: "PCAFM"
        method2: "AFM-baseline"
        heatmap_vmin: 0.80
        heatmap_vmax: 1.20
