# ESMValTool
# recipe_snow_test_cmip7.yml
---
documentation:
  title: Test snow variables from CMIP7

  description: |
    Recipe test snow

  authors:
    - lauer_axel

  maintainer:
    - lauer_axel

###datasets:
###  - {project: CMIP7, dataset: UKCM2-0-LL, exp: historical, ensemble: r1i1p1f1, grid: g110, mip: landIce, frequency: mon, region: glb, activity: CMIP, institute: UKNCSP, branding_suffix: tavg-u-hxy-lnd, alias: CMIP7-UKCM2-0-LL, end_year: 2019}
###  - {project: CMIP7, dataset: UKCM2a-0-HH, exp: historical, ensemble: r1i1p1f1, grid: g137, mip: landIce, frequency: mon, region: glb, activity: CMIP, institute: UKNCSP, branding_suffix: tavg-u-hxy-lnd, alias: CMIP7-UKCM2a-0-HH, end_year: 2019}
###  - {project: CMIP7, dataset: '*', exp: historical, ensemble: r1i1p1f1, grid: '*', mip: landIce, frequency: mon, region: glb, activity: CMIP, institute: '*', branding_suffix: tavg-u-hxy-lnd, end_year: 2019}


supplementary_variables: &supplementary_variables
  - {short_name: areacella, skip: true}


preprocessors:
  pp_snw:
#    regrid:
#      target_grid: 1x1
#      scheme: linear
    monthly_statistics:
      operator: mean
#    mask_glaciated:
#      mask_out: glaciated
    extract_shape:
      shapefile: shapefiles/esacci_snow_mountain_and_glacier_free_mask_05x05.shp
    mask_above_threshold:
      threshold: 500.
    mask_below_threshold:
      threshold: 0.1

  pp_snw_sum:
    custom_order: true
    extract_region:
      start_longitude: 0
      end_longitude: 360
      start_latitude: 45
      end_latitude: 90
    monthly_statistics:
      operator: mean
#    mask_glaciated:
#      mask_out: glaciated
    extract_shape:
      shapefile: shapefiles/esacci_snow_mountain_and_glacier_free_mask_05x05.shp
    mask_above_threshold:
      threshold: 500.
    area_statistics:
      operator: sum

  pp_snw_daily:
    regrid:
      target_grid: 1x1
      scheme: linear
    extract_region:
      start_longitude: 0
      end_longitude: 360
      start_latitude: 45
      end_latitude: 90
#    mask_glaciated:
#      mask_out: glaciated
    extract_shape:
      shapefile: shapefiles/esacci_snow_mountain_and_glacier_free_mask_05x05.shp
    mask_above_threshold:
      threshold: 500.
    mask_below_threshold:
      threshold: 0.1

  pp_snw_seascyc:
    regrid:
      target_grid: 1x1
      scheme: linear
    extract_region:
      start_longitude: 0
      end_longitude: 360
      start_latitude: 45
      end_latitude: 90
    climate_statistics:
      period: month
#    mask_glaciated:
#      mask_out: glaciated
    extract_shape:
      shapefile: shapefiles/esacci_snow_mountain_and_glacier_free_mask_05x05.shp
    mask_above_threshold:
      threshold: 500.
    area_statistics:
      operator: mean


diagnostics:
  snow_sum:
    title: NH total snow water equivalent
    description: NH total snow water equivalent
    variables:
      snw:
        mip: LImon
        start_year: 1979
        end_year: 2019
        exp: historical
        preprocessor: pp_snw_sum
        additional_datasets:
          - {dataset: ESACCI-SNOW, project: OBS6, mip: day, tier: 2, type: sat, version: v2.0}
          - {project: CMIP7, dataset: '*', exp: historical, ensemble: r1i1p1f1, grid: '*', mip: landIce, frequency: mon, region: glb, activity: CMIP, institute: '*', branding_suffix: tavg-u-hxy-lnd}
        supplementary_variables: *supplementary_variables
    scripts:
      plot:
        script: monitor/multi_datasets.py
        plot_folder: '{plot_dir}'
        plot_filename: '{plot_type}_{real_name}_{dataset}_{mip}'
        plots:
          timeseries:
            annual_mean_kwargs: False
            plot_kwargs:
              ESACCI-SNOW:
                color: black
              UKCM2-0-LL:
                color: blue
#            pyplot_kwargs:
#              ylim: [0.0e15, 5.5e15]

  snow_maps:
    title: seasonal mean snow water equivalent
    description: seasonal mean snow water equivalent
    variables:
      snw:
        start_year: 2010
        end_year: 2019
        preprocessor: pp_snw
        additional_datasets:
          - {dataset: ESACCI-SNOW, project: OBS6, mip: day, tier: 2, type: sat, version: v2.0}
          - {project: CMIP7, dataset: '*', exp: historical, ensemble: r1i1p1f1, grid: '*', mip: landIce, frequency: mon, region: glb, activity: CMIP, institute: '*', branding_suffix: tavg-u-hxy-lnd}
    scripts:
      plot:
        script: clouds/clouds.ncl
        projection: PolarStereographic
        timemean: seasonalclim
        showdiff: false
        explicit_cn_levels: [1, 2, 5, 10, 20, 50, 100, 200, 500, 1000]
#        region: [30, 90, 0, 360]
        region: [30, 90, -180, 180]

