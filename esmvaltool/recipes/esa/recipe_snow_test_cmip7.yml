  snow_seascyc:
    title: NH average snow water equivalent (seasonal cycle)
    description: NH average snow water equivalent (seasonal cycle)
    variables:
      snw:
        start_year: 2010
        end_year: 2014
        preprocessor: pp_snw_seascyc
        supplementary_variables: *supplementary_variables
        additional_datasets:
          - {dataset: ESACCI-SNOW, project: OBS6, mip: day, tier: 2, type: sat, version: v2.0}
          - {project: CMIP7, dataset: '*', exp: historical, ensemble: r1i1p1f1, grid: '*', mip: landIce, frequency: mon, region: glb, activity: CMIP, institute: '*', branding_suffix: tavg-u-hxy-lnd}
    scripts:
      plot:
        script: monitor/multi_datasets.py
        plot_folder: '{plot_dir}'
        plot_filename: '{plot_type}_{real_name}_{dataset}_{mip}'
        group_variables_by: variable_group
        facet_used_for_labels: dataset
        plots:
          annual_cycle:
            caption: '5-year average seasonal cycle of the NH snow water equivalent in kg/m2 [dataset] compared with ESACCI-SNOW.'
            pyplot_kwargs:
              title: 'NH average snow water equivalent (kg/m2)'
            plot_kwargs:
              ESACCI-SNOW:
                color: black
              UKCM2-0-LL:
                color: blue
