# ESMValTool
---
documentation:
  title: Precip histograms
  description: >
    Plot PDF of precipitation rates.
  authors:
    - lauer_axel


datasets:
  # one year is enough data
#  - {dataset: ERA5, project: native6, type: reanaly, version: v1, tier: 3, frequency: 1hr, alias: 'ERA5'}
###  - {project: CMIP7, dataset: '*', exp: historical, ensemble: r1i1p1f1, grid: '*', mip: atmos, frequency: day, region: glb, activity: CMIP, institute: '*', branding_suffix: tavg-h2m-hxy-u}
  - {project: CMIP7, dataset: ACCESS-ESM1-6, exp: historical, ensemble: r1i1p1f1, grid: '*', mip: atmos, frequency: day, region: glb, activity: CMIP, institute: '*', branding_suffix: tavg-h2m-hxy-u}
#  - {project: CMIP7, dataset: UKCM2-0-LL, exp: historical, ensemble: r1i1p1f1, grid: '*', mip: atmos, frequency: day, region: glb, activity: CMIP, institute: '*', branding_suffix: tavg-h2m-hxy-u}


preprocessors:
  pp_globe:
    climate_statistics:

  pp_waf:
    mask_landsea:
      mask_out: sea
    area_statistics:
      operator: mean
    extract_shape:
      shapefile: ar6
      crop: true
      decomposed: false
      ids:
        Name:
          - Western-Africa


diagnostics:

  cdd22_timeseries_waf:
    description: Plot time series of CDD in Western Africa.
    variables:
      cdd22:
        preprocessor: pp_waf
        project: CMIP6
        mip: day
        derive: true
        timerange: '1980/2022'
        exp: historical
        supplementary_variables:
          - short_name: areacella
            skip: true
          - short_name: areacello
            skip: true
          - short_name: sftlf
            skip: true
          - short_name: sftof
            skip: true
    scripts:
      plot:
        script: monitor/multi_datasets.py
        plot_folder: '{plot_dir}'
        plot_filename: '{plot_type}_{real_name}_{dataset}_{mip}'
        plots:
          timeseries:
            plot_kwargs:
              ACCESS-ESM1-6:
                color: red
              ERA5:
                color: black
#            pyplot_kwargs:
#              ylim: [6, 16]


  cdd22_map:
    description: Plot map of CDD.
    variables:
      cdd22:
        preprocessor: pp_globe
        project: CMIP6
        mip: day
        derive: true
        timerange: '2020/2020'
        exp: historical
        supplementary_variables:
          - short_name: areacella
            skip: true
          - short_name: areacello
            skip: true
          - short_name: sftlf
            skip: true
          - short_name: sftof
            skip: true
    scripts:
      plot:
        script: monitor/multi_datasets.py
        plot_folder: '{plot_dir}'
        plot_filename: '{plot_type}_{real_name}_{dataset}_{exp}'
        facet_used_for_labels: dataset
        plots:
          map:
            common_cbar: true
            show_stats: false
            fontsize: 9
            pyplot_kwargs:
              suptitle: '{long_name}'
            plot_kwargs:
              default:
                cmap: YlOrRd
#                levels: [0.0, 10.0, 20.0, 30.0, 40.0, 50.0, 60.0, 70.0, 80.0, 90.0, 100.0]
