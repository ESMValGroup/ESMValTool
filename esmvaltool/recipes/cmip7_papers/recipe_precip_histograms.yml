# ESMValTool
---
documentation:
  title: Precip histograms
  description: >
    Plot PDF of precipitation rates.
  authors:
    - lauer_axel


datasets:
  # one year is enough data
  - {dataset: ERA5, project: native6, type: reanaly, version: v1, tier: 3, frequency: 1hr, alias: 'ERA5'}
#  - {dataset: ICON-XPP, project: ICON, exp: tvp1802_001, start_year: 2005, end_year: 2014, component: atm, var_type: atm_3d_ml, alias: 'ICON-XPP'}
#  - {dataset: ICON-XPP, project: ICON, exp: historical-202510p1, start_year: 2005, end_year: 2014, component: atm, var_type: atm_3d_ml, alias: 'ICON-XPP'}
###  - {project: CMIP7, dataset: '*', exp: historical, ensemble: r1i1p1f1, grid: '*', mip: atmos, frequency: day, region: glb, activity: CMIP, institute: '*', branding_suffix: tavg-u-hxy-u}
  - {project: CMIP7, dataset: ACCESS-ESM1-6, exp: historical, ensemble: r1i1p1f1, grid: '*', mip: atmos, frequency: day, region: glb, activity: CMIP, institute: '*', branding_suffix: tavg-u-hxy-u}
#  - {project: CMIP7, dataset: UKCM2-0-LL, exp: historical, ensemble: r1i1p1f1, grid: '*', mip: atmos, frequency: day, region: glb, activity: CMIP, institute: '*', branding_suffix: tavg-u-hxy-u}


preprocessors:
  pp_daily:
    custom_order: true
#    regrid:
#      target_grid: 1x1
#      scheme: linear
    daily_statistics:
    extract_shape:
      shapefile: shapefiles/clim_regs.shp
      crop: true
      decomposed: true
      ids:
        clim_regs:
          - tropics
          - nh_midlat
          - sh_midlat
    convert_units:
      units: mm hour-1

  pp_daily2:
    custom_order: true
#    regrid:
#      target_grid: 1x1
#      scheme: linear
    daily_statistics:
    extract_shape:
      shapefile: shapefiles/clim_regs.shp
      crop: true
      decomposed: false
      ids:
        clim_regs:
          - tropics
#          - nh_midlat
#          - sh_midlat
    convert_units:
      units: mm hour-1
    histogram:
      bins: 40
#      bins: [0, 0.5, 1, 1.5, 2, 2.5, 3, 5, 7, 10, 15, 20]
      normalization: integral
      bin_range:
        - 0.0
        - 20.0


