  precip_rate_pdf2:
    description: Plot PDF of daily precipitation rates.
    variables:
      pr:
        preprocessor: pp_daily2
        mip: day
        timerange: '2011/2020'
        supplementary_variables:
          - short_name: areacella
            skip: true
          - short_name: areacello
            skip: true
          - short_name: sftlf
            skip: true
          - short_name: sftof
            skip: true
    scripts:
      plot:
        script: plot_histogram.py
        log_y: true
        ylim:
          - 0.0
          - 1.0
        suptitle: 'Tropics (30S-30N), 2011-2020'
        xlabel: 'Daily mean precipitation rate [mm hr-1]'
        ylabel: 'Probability density'
