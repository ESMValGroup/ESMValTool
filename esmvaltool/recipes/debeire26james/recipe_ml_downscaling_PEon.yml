# ESMValTool
# recipe_ml_downscaling_PEon.yml
#
# Positional-embedding ablation (revision 1, comment R1-M3 / R2-Min1).
# `AFM-PosEmb` is identical to `AFM-baseline` except for 4-channel sinusoidal
# positional embeddings re-enabled in both networks (matches Fotiadis 2024).
# Heatmap compares AFM-PosEmb vs AFM-baseline (clean PE-effect within AFM
# architecture); PCAFM is kept as a context method in the eval blocks.
#
# This recipe runs over **all three regions** (CE, IBE, SCA) in a single
# invocation. Per-region datasets are encoded via the `version` facet:
# `1` (Central Europe), `1-Iberia`, `1-Scandinavia`. One diagnostic block
# per region keeps the per-region metric calculations independent.
---
documentation:
  description: |
    Positional-embedding ablation: AFM-PosEmb vs AFM-baseline / PCAFM
    over CE, IBE, SCA. Addresses R1-M3 and R2-Min1.
  authors:
    - debeire_kevin
  title: PE-on ablation (revision 1)
  maintainer:
    - debeire_kevin

# Top-level dataset list is empty; each diagnostic block injects the
# region-specific list via per-variable `additional_datasets`.
datasets: []

# --------------------------------------------------------------------------
# YAML anchors for region-specific dataset lists. Defined under
# `_dataset_groups` so ESMValTool ignores them as an unknown key but YAML
# parsers still expand the anchors below.
