preprocessors:
  pp_extract_time: &pp_time
    extract_time: &time_window
      start_day: 20
      start_month: 01
      start_year: 2024
      end_day: 18
      end_month: 01
      end_year: 2025
  pp_tas:   {<<: *pp_time, convert_units: {units: degC}}
  pp_huss:  {<<: *pp_time, convert_units: {units: g kg-1}}
  pp_pr:    {<<: *pp_time, convert_units: {units: mm h-1}}
  pp_ps:    {<<: *pp_time, convert_units: {units: hPa}}
  pp_qmae_tas:  {<<: *pp_time, extract_season: {season: "JJA"}, convert_units: {units: degC}}
  pp_qmae_huss: {<<: *pp_time, extract_season: {season: "JJA"}, convert_units: {units: g kg-1}}
  pp_qmae_ps:   {<<: *pp_time, extract_season: {season: "JJA"}, convert_units: {units: hPa}}
  pp_qmae_pr:   {<<: *pp_time, extract_season: {season: "DJF"}, convert_units: {units: mm h-1}}
  pp_qmae_uas:  {<<: *pp_time, extract_season: {season: "SON"}}
  pp_qmae_vas:  {<<: *pp_time, extract_season: {season: "SON"}}

  # Iberia variants: add extract_region clip; CE/SCA NetCDFs are already
  # region-scoped so no extra clipping needed there.
  pp_extract_time_IBE: &pp_time_IBE
    extract_time: *time_window
    extract_region: &ibe_clip
      start_longitude: -15
      end_longitude: 3
      start_latitude: 24
      end_latitude: 42
  pp_tas_IBE:   {<<: *pp_time_IBE, convert_units: {units: degC}}
  pp_huss_IBE:  {<<: *pp_time_IBE, convert_units: {units: g kg-1}}
  pp_pr_IBE:    {<<: *pp_time_IBE, convert_units: {units: mm h-1}}
  pp_ps_IBE:    {<<: *pp_time_IBE, convert_units: {units: hPa}}
  pp_qmae_tas_IBE:  {<<: *pp_time_IBE, extract_season: {season: "JJA"}, convert_units: {units: degC}}
  pp_qmae_huss_IBE: {<<: *pp_time_IBE, extract_season: {season: "JJA"}, convert_units: {units: g kg-1}}
  pp_qmae_ps_IBE:   {<<: *pp_time_IBE, extract_season: {season: "JJA"}, convert_units: {units: hPa}}
  pp_qmae_pr_IBE:   {<<: *pp_time_IBE, extract_season: {season: "DJF"}, convert_units: {units: mm h-1}}
  pp_qmae_uas_IBE:  {<<: *pp_time_IBE, extract_season: {season: "SON"}}
  pp_qmae_vas_IBE:  {<<: *pp_time_IBE, extract_season: {season: "SON"}}

# Common script options reused across regions (YAML anchors).
_script_opts:
  ml_methods: &_ml ["AFM-baseline", "PCAFM", "AFM-PosEmb"]

diagnostics:

  # =====================================================================
  # Region 1 — Central Europe (training domain)
  # =====================================================================
  PEon_eval_CE:
    description: "PE-on ablation — CE"
    variables:
      uas:  {preprocessor: pp_extract_time, additional_datasets: *CE_datasets}
      vas:  {preprocessor: pp_extract_time, additional_datasets: *CE_datasets}
      huss: {preprocessor: pp_huss,         additional_datasets: *CE_datasets}
      ps:   {preprocessor: pp_ps,           additional_datasets: *CE_datasets}
      pr:   {preprocessor: pp_pr,           additional_datasets: *CE_datasets}
      tas:  {preprocessor: pp_tas,          additional_datasets: *CE_datasets}
    scripts:
      spatial_metrics: &spatial_metrics_cfg
        script: regional_downscaling/ml_downscaling_evaluation.py
        ml_methods: *_ml
        reference: HIGHRES-REF
        analysis_type: spatial_metrics
        compute_relbias_pr: true
        compute_conservation: ["pr", "huss"]
        pool_factor: 10
      energy_spectrum: &spec_cfg
        script: regional_downscaling/ml_downscaling_evaluation.py
        ml_methods: *_ml
        reference: HIGHRES-REF
        analysis_type: energy_spectrum
      log_density: &logd_cfg
        script: regional_downscaling/ml_downscaling_evaluation.py
        ml_methods: *_ml
        reference: HIGHRES-REF
        analysis_type: log_density
      calibration: &cal_cfg
        script: regional_downscaling/ml_downscaling_evaluation.py
        ml_methods: *_ml
        reference: HIGHRES-REF
        analysis_type: calibration

  PEon_quantileMAE_CE:
    description: "PE-on ablation — Quantile MAE — CE"
    variables:
      uas:  {preprocessor: pp_qmae_uas,  additional_datasets: *CE_datasets}
      vas:  {preprocessor: pp_qmae_vas,  additional_datasets: *CE_datasets}
      huss: {preprocessor: pp_qmae_huss, additional_datasets: *CE_datasets}
      ps:   {preprocessor: pp_qmae_ps,   additional_datasets: *CE_datasets}
      pr:   {preprocessor: pp_qmae_pr,   additional_datasets: *CE_datasets}
      tas:  {preprocessor: pp_qmae_tas,  additional_datasets: *CE_datasets}
    scripts:
      quantile_MAE: &qmae_cfg
        script: regional_downscaling/ml_downscaling_evaluation.py
        ml_methods: *_ml
        reference: HIGHRES-REF
        analysis_type: quantile_MAE
        compute_wbgt: true
        compute_wind: true
        compute_pr: true

  PEon_heatmap_CE:
    description: "PE-on heatmap — CE"
    scripts:
      heatmap:
        script: regional_downscaling/ml_downscaling_heatmap.py
        ancestors:
          - 'PEon_eval_CE/spatial_metrics'
          - 'PEon_eval_CE/energy_spectrum'
          - 'PEon_eval_CE/log_density'
          - 'PEon_eval_CE/calibration'
          - 'PEon_quantileMAE_CE/quantile_MAE'
        method1: "AFM-PosEmb"
        method2: "AFM-baseline"
        region_name: "PE-on ablation — CE"
        heatmap_vmin: 0.80
        heatmap_vmax: 1.20

  PEon_combined_panel_CE:
    description: "PE-on per-variable panel — CE"
    scripts:
      panel:
        script: regional_downscaling/ml_downscaling_combined_panel.py
        ancestors:
          - 'PEon_eval_CE/spatial_metrics'
          - 'PEon_eval_CE/energy_spectrum'
          - 'PEon_eval_CE/log_density'
          - 'PEon_eval_CE/calibration'
        variables: ["pr", "huss", "tas", "ps", "uas", "vas"]
        panel_fig_width: 18
        region_name: "PE-on ablation — CE"

  # =====================================================================
  # Region 2 — Iberian Peninsula (OOD)
  # =====================================================================
  PEon_eval_IBE:
    description: "PE-on ablation — IBE"
    variables:
      uas:  {preprocessor: pp_extract_time_IBE, additional_datasets: *IBE_datasets}
      vas:  {preprocessor: pp_extract_time_IBE, additional_datasets: *IBE_datasets}
      huss: {preprocessor: pp_huss_IBE,         additional_datasets: *IBE_datasets}
      ps:   {preprocessor: pp_ps_IBE,           additional_datasets: *IBE_datasets}
      pr:   {preprocessor: pp_pr_IBE,           additional_datasets: *IBE_datasets}
      tas:  {preprocessor: pp_tas_IBE,          additional_datasets: *IBE_datasets}
    scripts:
      spatial_metrics: {<<: *spatial_metrics_cfg, reference: HIGHRES-REF-Iberia, compute_relbias_pr: false}
      energy_spectrum: {<<: *spec_cfg,            reference: HIGHRES-REF-Iberia}
      log_density:     {<<: *logd_cfg,            reference: HIGHRES-REF-Iberia}
      calibration:     {<<: *cal_cfg,             reference: HIGHRES-REF-Iberia}

  PEon_quantileMAE_IBE:
    description: "PE-on ablation — Quantile MAE — IBE"
    variables:
      uas:  {preprocessor: pp_qmae_uas_IBE,  additional_datasets: *IBE_datasets}
      vas:  {preprocessor: pp_qmae_vas_IBE,  additional_datasets: *IBE_datasets}
      huss: {preprocessor: pp_qmae_huss_IBE, additional_datasets: *IBE_datasets}
      ps:   {preprocessor: pp_qmae_ps_IBE,   additional_datasets: *IBE_datasets}
      pr:   {preprocessor: pp_qmae_pr_IBE,   additional_datasets: *IBE_datasets}
      tas:  {preprocessor: pp_qmae_tas_IBE,  additional_datasets: *IBE_datasets}
    scripts:
      quantile_MAE: {<<: *qmae_cfg, reference: HIGHRES-REF-Iberia}

  PEon_heatmap_IBE:
    description: "PE-on heatmap — IBE"
    scripts:
      heatmap:
        script: regional_downscaling/ml_downscaling_heatmap.py
        ancestors:
          - 'PEon_eval_IBE/spatial_metrics'
          - 'PEon_eval_IBE/energy_spectrum'
          - 'PEon_eval_IBE/log_density'
          - 'PEon_eval_IBE/calibration'
          - 'PEon_quantileMAE_IBE/quantile_MAE'
        method1: "AFM-PosEmb"
        method2: "AFM-baseline"
        region_name: "PE-on ablation — IBE"
        heatmap_vmin: 0.80
        heatmap_vmax: 1.20

  PEon_combined_panel_IBE:
    description: "PE-on per-variable panel — IBE"
    scripts:
      panel:
        script: regional_downscaling/ml_downscaling_combined_panel.py
        ancestors:
          - 'PEon_eval_IBE/spatial_metrics'
          - 'PEon_eval_IBE/energy_spectrum'
          - 'PEon_eval_IBE/log_density'
          - 'PEon_eval_IBE/calibration'
        variables: ["pr", "huss", "tas", "ps", "uas", "vas"]
        panel_fig_width: 18
        region_name: "PE-on ablation — IBE"

  # =====================================================================
  # Region 3 — Scandinavia / Northern Europe (OOD)
  # =====================================================================
  PEon_eval_SCA:
    description: "PE-on ablation — SCA"
    variables:
