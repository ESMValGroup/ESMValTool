    scripts:
      quantile_MAE: {<<: *qmae_cfg, reference: HIGHRES-REF-Scandinavia}

  PEon_heatmap_SCA:
    description: "PE-on heatmap — SCA"
    scripts:
      heatmap:
        script: regional_downscaling/ml_downscaling_heatmap.py
