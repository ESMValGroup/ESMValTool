preprocessors:
  preproc_extract_time:
    extract_time:
      start_day: 20
      start_month: 01
      start_year: 2024
      end_day: 18
      end_month: 01
      end_year: 2025
  preproc_convert_tas:
    convert_units:
      units: degC
    extract_time:
      start_day: 20
      start_month: 01
      start_year: 2024
      end_day: 18
      end_month: 01
      end_year: 2025

  preproc_convert_huss:
    convert_units:
      units: g kg-1
    extract_time:
      start_day: 20
      start_month: 01
      start_year: 2024
      end_day: 18
      end_month: 01
      end_year: 2025

  preproc_convert_pr:
    convert_units:
      units: mm h-1
    extract_time:
      start_day: 20
