preprocessors:
  pp_extract_time: &pp_time
    extract_time: &time_window
      start_day: 20
      start_month: 01
      start_year: 2024
      end_day: 18
      end_month: 01
      end_year: 2025
  pp_tas:   {<<: *pp_time, convert_units: {units: degC}}
  pp_huss:  {<<: *pp_time, convert_units: {units: g kg-1}}
  pp_pr:    {<<: *pp_time, convert_units: {units: mm h-1}}
  pp_ps:    {<<: *pp_time, convert_units: {units: hPa}}
  pp_qmae_tas:  {<<: *pp_time, extract_season: {season: "JJA"}, convert_units: {units: degC}}
  pp_qmae_huss: {<<: *pp_time, extract_season: {season: "JJA"}, convert_units: {units: g kg-1}}
  pp_qmae_ps:   {<<: *pp_time, extract_season: {season: "JJA"}, convert_units: {units: hPa}}
  pp_qmae_pr:   {<<: *pp_time, extract_season: {season: "DJF"}, convert_units: {units: mm h-1}}
  pp_qmae_uas:  {<<: *pp_time, extract_season: {season: "SON"}}
  pp_qmae_vas:  {<<: *pp_time, extract_season: {season: "SON"}}

  # Iberia variants: add extract_region clip to the bounds matching the
  # HIGHRES-REF-Iberia files; CE/SCA need no clipping (their NetCDFs are
  # already region-scoped).
  pp_extract_time_IBE: &pp_time_IBE
    extract_time: *time_window
    extract_region: &ibe_clip
      start_longitude: -15
      end_longitude: 3
      start_latitude: 24
      end_latitude: 42
  pp_tas_IBE:   {<<: *pp_time_IBE, convert_units: {units: degC}}
  pp_huss_IBE:  {<<: *pp_time_IBE, convert_units: {units: g kg-1}}
  pp_pr_IBE:    {<<: *pp_time_IBE, convert_units: {units: mm h-1}}
  pp_ps_IBE:    {<<: *pp_time_IBE, convert_units: {units: hPa}}
  pp_qmae_tas_IBE:  {<<: *pp_time_IBE, extract_season: {season: "JJA"}, convert_units: {units: degC}}
  pp_qmae_huss_IBE: {<<: *pp_time_IBE, extract_season: {season: "JJA"}, convert_units: {units: g kg-1}}
  pp_qmae_ps_IBE:   {<<: *pp_time_IBE, extract_season: {season: "JJA"}, convert_units: {units: hPa}}
  pp_qmae_pr_IBE:   {<<: *pp_time_IBE, extract_season: {season: "DJF"}, convert_units: {units: mm h-1}}
  pp_qmae_uas_IBE:  {<<: *pp_time_IBE, extract_season: {season: "SON"}}
  pp_qmae_vas_IBE:  {<<: *pp_time_IBE, extract_season: {season: "SON"}}

_script_opts:
  # 2x2 ablation cell methods:
  #   AFM-baseline      : surfaces in,  no conservation        (production baseline)
  #   PCAFM             : surfaces in,  with conservation      (production method)
  #   AFM-noSURF-dyn     : dyn-surfaces only, no conservation   (RCM-emulator baseline, E-T3d)
  #   PCAFM-noSURF-dyn   : dyn-surfaces only, with conservation (E-T3c)
  ml_methods: &_ml ["AFM-baseline", "PCAFM", "AFM-noSURF-dyn", "PCAFM-noSURF-dyn"]

diagnostics:

  # =====================================================================
  # Region 1 — Central Europe
  # =====================================================================
  noSurfaceDyn_eval_CE:
    description: "noSURF-dyn (middle-ground) ablation — CE"
    variables:
      uas:  {preprocessor: pp_extract_time, additional_datasets: *CE_datasets}
      vas:  {preprocessor: pp_extract_time, additional_datasets: *CE_datasets}
      huss: {preprocessor: pp_huss,         additional_datasets: *CE_datasets}
      ps:   {preprocessor: pp_ps,           additional_datasets: *CE_datasets}
      pr:   {preprocessor: pp_pr,           additional_datasets: *CE_datasets}
      tas:  {preprocessor: pp_tas,          additional_datasets: *CE_datasets}
    scripts:
      spatial_metrics: &spatial_metrics_cfg
        script: regional_downscaling/ml_downscaling_evaluation.py
        ml_methods: *_ml
        reference: HIGHRES-REF
        analysis_type: spatial_metrics
        compute_relbias_pr: true
        compute_conservation: ["pr", "huss"]
        pool_factor: 10
      energy_spectrum: &spec_cfg
        script: regional_downscaling/ml_downscaling_evaluation.py
        ml_methods: *_ml
        reference: HIGHRES-REF
        analysis_type: energy_spectrum
      log_density: &logd_cfg
        script: regional_downscaling/ml_downscaling_evaluation.py
        ml_methods: *_ml
        reference: HIGHRES-REF
        analysis_type: log_density
      calibration: &cal_cfg
        script: regional_downscaling/ml_downscaling_evaluation.py
        ml_methods: *_ml
        reference: HIGHRES-REF
        analysis_type: calibration

