# ESMValTool
# recipe_ml_downscaling_noSurface_dyn.yml
#
# Pressure-level-only PC-AFM ablation (revision 1, comment R1-D1 / R1-D2).
# Middle-ground perfect-prognosis variant (E-T3c / E-T3d): drops only the
# bias-prone surface inputs (pr, huss, rlds, rlus, rsds, rsus) and KEEPS the
# well-projected dynamical fields (tas, uas, vas, ps) + 24 pressure-level +
# 3 static = 31 channels; the conservation loss is unchanged.
#
# Multi-region: CE, IBE, SCA via the `version` facet (`1`, `1-Iberia`,
# `1-Scandinavia`).
---
documentation:
  description: |
    Middle-ground perfect-prognosis PC-AFM: PCAFM-noSURF-dyn vs AFM-baseline /
    PCAFM / AFM-noSURF-dyn over CE, IBE, SCA. Addresses R1-D1 / R1-D2.
  authors:
    - debeire_kevin
  title: noSURF-dyn (middle-ground) ablation (revision 1)
  maintainer:
    - debeire_kevin

datasets: []

