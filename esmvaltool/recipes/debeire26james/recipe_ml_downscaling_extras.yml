# ESMValTool
# recipe_ml_downscaling_extras.yml
#
# Additional diagnostics added for the revision 1 response (R1-M1, R1-M2,
# R2-M7, R2-M8, R2-SI4). Drives ml_downscaling_extras.py over the
# existing AFM-baseline / PCAFM checkpoints across all three evaluation
# regions (CE, IBE, SCA) via the version facet (`1`, `1-Iberia`,
# `1-Scandinavia`).
#
# Each diagnostic is repeated per region with its own block so per-region
# figures are produced; the final summary-table diagnostic aggregates
# across regions.
