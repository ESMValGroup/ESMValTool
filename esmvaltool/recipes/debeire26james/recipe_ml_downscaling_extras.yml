preprocessors:
  pp_extract_time: &pp_time
    extract_time:
      start_day: 20
      start_month: 01
      start_year: 2024
      end_day: 18
      end_month: 01
      end_year: 2025
  pp_tas:  {<<: *pp_time, convert_units: {units: degC}}
  pp_huss: {<<: *pp_time, convert_units: {units: g kg-1}}
  pp_pr:   {<<: *pp_time, convert_units: {units: mm h-1}}
  pp_ps:   {<<: *pp_time, convert_units: {units: hPa}}
  pp_qmae_pr_DJF: {<<: *pp_time, extract_season: {season: "DJF"}, convert_units: {units: mm h-1}}

  # IBE: clip to (lon -15..3, lat 24..42) so the longitude span stays on
  # one side of the prime meridian — the diagnostic's map projection
  # otherwise wraps and renders the IBE panels incorrectly.
  pp_extract_time_IBE: &pp_time_IBE
    extract_time:
      start_day: 20
      start_month: 01
      start_year: 2024
      end_day: 18
      end_month: 01
      end_year: 2025
    extract_region:
      start_longitude: -15
      end_longitude: 3
      start_latitude: 24
      end_latitude: 42
  pp_tas_IBE:  {<<: *pp_time_IBE, convert_units: {units: degC}}
  pp_huss_IBE: {<<: *pp_time_IBE, convert_units: {units: g kg-1}}
  pp_pr_IBE:   {<<: *pp_time_IBE, convert_units: {units: mm h-1}}
  pp_ps_IBE:   {<<: *pp_time_IBE, convert_units: {units: hPa}}
  pp_qmae_pr_DJF_IBE: {<<: *pp_time_IBE, extract_season: {season: "DJF"}, convert_units: {units: mm h-1}}

_script_opts:
  # Ensemble-only diagnostics (cond_rank histogram, spatial pairwise Q-MAE
  # ratio) keep the original AFM-baseline + PCAFM pair.
  ml_methods: &_ml ["AFM-baseline", "PCAFM"]
  # Deterministic-friendly diagnostics also include UNet (single ensemble
  # member: version `1`, `1-Iberia`, `1-Scandinavia`).
  ml_methods_with_unet: &_ml_with_unet ["AFM-baseline", "PCAFM", "UNet"]

# ============================================================================
# Helpers (YAML anchors) — script configurations re-used across regions.
# ============================================================================
_script_anchors:
  clim: &cfg_clim
    script: regional_downscaling/ml_downscaling_extras.py
    ml_methods: *_ml_with_unet
    reference: HIGHRES-REF
    analysis_type: climatology
  percentile: &cfg_percentile
    script: regional_downscaling/ml_downscaling_extras.py
    ml_methods: *_ml_with_unet
    reference: HIGHRES-REF
    analysis_type: percentile_map
    percentile: 99.0
  cdd: &cfg_cdd
    script: regional_downscaling/ml_downscaling_extras.py
    ml_methods: *_ml_with_unet
    reference: HIGHRES-REF
    analysis_type: cdd
  rx1day: &cfg_rx1day
    script: regional_downscaling/ml_downscaling_extras.py
    ml_methods: *_ml_with_unet
    reference: HIGHRES-REF
    analysis_type: rx1day
  cond_rank: &cfg_cond_rank
    script: regional_downscaling/ml_downscaling_extras.py
    ml_methods: *_ml       # ensemble-only -- rank histogram needs ensemble
    reference: HIGHRES-REF
    analysis_type: conditional_rank_histogram
  return_level: &cfg_return_level
    script: regional_downscaling/ml_downscaling_extras.py
    ml_methods: *_ml_with_unet
    reference: HIGHRES-REF
    analysis_type: return_level
  temporal_spectrum: &cfg_temporal_spectrum
    script: regional_downscaling/ml_downscaling_extras.py
    ml_methods: *_ml_with_unet
    reference: HIGHRES-REF
    analysis_type: temporal_spectrum
    dt_hours: 3.0
  cross_var: &cfg_cross_var
    script: regional_downscaling/ml_downscaling_extras.py
    ml_methods: *_ml_with_unet
    reference: HIGHRES-REF
    analysis_type: cross_variable_correlation
  case_study: &cfg_case_study
    script: regional_downscaling/ml_downscaling_extras.py
    ml_methods: *_ml_with_unet
    reference: HIGHRES-REF
    analysis_type: case_study
    case_study_seed: 42
  spatial_qmae: &cfg_spatial_qmae
    script: regional_downscaling/ml_downscaling_extras.py
    ml_methods: *_ml       # pairwise PCAFM/AFM-baseline ratio
    reference: HIGHRES-REF
    analysis_type: spatial_quantile_mae

