documentation:
  description: |
    Extra diagnostics — climatology, percentile maps, CDD, Rx1day,
    conditional rank histograms, return-level, temporal spectra,
    cross-variable correlation, case study, spatial Quantile-MAE map,
    combined Q-MAE summary table.
  authors:
    - debeire_kevin
  title: Revision 1 — extra diagnostics
  maintainer:
    - debeire_kevin

