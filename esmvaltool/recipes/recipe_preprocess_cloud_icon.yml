# ESMValTool
# recipe_preprocess_cloud_icon.yml
---
documentation:
  description: |
    Preprocess cloud properties and cloud controlling factors for causal
    inference study.

  authors:
    - bock_lisa

  title: Preprocess cloud timeseries.

  maintainer:
    - bock_lisa

  projects:
    - cmug


years: &years
  timerange: 200001/200012


datasets:
- supplementary_variables:
  - short_name: areacella
    skip: true
  - short_name: areacello
    skip: true
  - short_name: sftlf
    skip: true
  - short_name: sftof
    skip: true
  dataset: ICON
  exp: atm_amip_r2b5_cov15_tuned
  project: ICON


preprocessors:

  regrid_prep:
    resample_time:
      hour: 12
    regrid: &regrid
      scheme: area_weighted
      target_grid: 1x1

  regrid_prep_lev:
    custom_order: true
    resample_time:
      hour: 12
    extract_levels:
      levels: {cmor_table: CMIP6, coordinate: plev27}
      scheme: linear
      coordinate: air_pressure
    regrid:
      scheme: area_weighted
      target_grid: 1x1

  south_east_pacific: &sep_pp
    extract_region:
      start_latitude: -30.
      end_latitude: -10.
      start_longitude: 265.
      end_longitude: 285.
    mask_landsea:
      mask_out: land

  mean_pp:
    <<: *sep_pp
    regrid:
      <<: *regrid

  mean_pp_3hr:
    <<: *sep_pp
    regrid:
      <<: *regrid
    resample_time:
      hour: 12

  mean_pp_700:
    <<: *sep_pp
    extract_levels:
      levels: 70000
      scheme: linear
      coordinate: air_pressure
    regrid:
      <<: *regrid

  mean_pp_1000:
    <<: *sep_pp
    extract_levels:
      levels: 100000
      scheme: linear
      coordinate: air_pressure
    regrid:
      <<: *regrid



