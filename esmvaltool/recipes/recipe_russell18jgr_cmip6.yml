# ESMValTool
# CMIP6 companion; the original CMIP5 recipe is retained.
---
documentation:
  title: Southern Ocean Metrics with CMIP6
  description: |
    CMIP6 companion to recipe_russell18jgr.yml for historical 1986-2005.
    Includes ACCESS-ESM1-5 and representatives of the CanESM, GFDL and
    IPSL model families. Model selection depends on field availability.
    The legacy diagnostic methods and their transport approximations
    are retained; this is not an exact reproduction of the paper.
  authors:
    - russell_joellen
    - pandde_amarjiit
  maintainer:
    - russell_joellen
    - pandde_amarjiit
  references:
    - russell18jgr
  projects:
    - russell_project
preprocessors:
  preprocessor_time_land:
    climate_statistics:
      operator: mean
      period: full
    mask_landsea:
      mask_out: land
  preprocessor_time:
    climate_statistics:
      operator: mean
      period: full
diagnostics:
  Figure_1:
    description: Annual mean atmospheric zonal wind stress (Amon tauu), land masked.
    themes:
      - phys
    realms:
      - ocean
    variables:
      tauu:
        mip: Amon
        project: CMIP6
        exp: historical
        ensemble: r1i1p1f1
        grid: gn
        start_year: 1986
        end_year: 2005
        preprocessor: preprocessor_time_land
        additional_datasets:
          - {dataset: ACCESS-ESM1-5}
          - {dataset: CanESM5}
          - {dataset: GFDL-ESM4, grid: gr1}
          - {dataset: IPSL-CM6A-LR, grid: gr}
    scripts:
      polar-tauu:
        script: russell18jgr/russell18jgr_polar.py
        styleset: CMIP6
        grid_min: -0.4
        grid_max: 0.4
        grid_step: 0.1
        colors:
          - [237.6, 237.6, 0.0]
          - [255, 255, 66.4]
          - [255, 255, 119.6]
          - [255, 255, 191.8]
          - [223.8, 191.8, 223.8]
          - [192.8, 127.5, 190.8]
          - [161.6, 65.3, 158.6]
          - [129.5, 1.0, 126.5]
        labelBar_end_type: ExcludeOuterBoxes
        max_lat: -30.0
        max_vert: 2
        max_hori: 1
  Figure_2:
    description: |
      Zonal and annual mean ocean surface zonal stress (Omon tauuo).
      This follows the CMIP5 recipe; tauuo differs from Figure 1 tauu.
    themes:
      - phys
    realms:
      - ocean
    variables:
      tauuo:
        mip: Omon
        project: CMIP6
        exp: historical
        ensemble: r1i1p1f1
        grid: gn
        start_year: 1986
        end_year: 2005
        preprocessor: preprocessor_time
        additional_datasets:
          - {dataset: ACCESS-ESM1-5}
          - {dataset: CanESM5}
          - {dataset: GFDL-ESM4}
          - {dataset: IPSL-CM6A-LR}
    scripts:
      tauu-lineplot:
        script: russell18jgr/russell18jgr_fig2.py
        styleset: CMIP6
  Figure_3b:
    description: |
      Diagnostic for russell et al figure 3b. Plots the latitudinal position of
      Subantarctic Front. Using definitions from Orsi et al (1995), the
      Subantarctic Front is defined here as the poleward location of
      the 4C(277.15K) isotherm at(closest to and less than) 400 m.
    themes:
      - phys
    realms:
      - ocean
    variables:
      thetao:
        mip: Omon
        project: CMIP6
        exp: historical
        ensemble: r1i1p1f1
        grid: gn
        start_year: 1986
        end_year: 2005
        additional_datasets:
          - {dataset: ACCESS-ESM1-5}
          - {dataset: CanESM5}
          - {dataset: GFDL-ESM4}
          - {dataset: IPSL-CM6A-LR}
    scripts:
      Subantarctic-Front:
        script: russell18jgr/russell18jgr_fig3b.py
        styleset: CMIP6
  Figure_3b-2:
    description: |
      Diagnostic for russell et al figure 3b-2 (Polar fronts). Plots the
      latitudinal position of Polar Front. Using definitions from Orsi et
      al. (1995). The Polar Front is defined here as the poleward location
      of the 2C (275.15K) isotherm of the temperature minimum between 0 and
      200 m (closest to and less than 200m).
    themes:
      - phys
    realms:
      - ocean
    variables:
      thetao:
        mip: Omon
        project: CMIP6
        exp: historical
        ensemble: r1i1p1f1
        grid: gn
        start_year: 1986
        end_year: 2005
        additional_datasets:
          - {dataset: ACCESS-ESM1-5}
          - {dataset: CanESM5}
          - {dataset: GFDL-ESM4}
          - {dataset: IPSL-CM6A-LR}
    scripts:
      Polar-front:
        script: russell18jgr/russell18jgr_fig3b_2.py
        styleset: CMIP6
  Figure_4:
    description: |
      Zonal velocity at Drake Passage (69W). The climatological transport
      estimate is shown for ACCESS-ESM1-5, which supplies fixed volcello.
      CanESM5 and IPSL-CM6A-LR show velocity only.
    themes:
      - phys
    realms:
      - ocean
    variables:
      uo:
        mip: Omon
        project: CMIP6
        exp: historical
        ensemble: r1i1p1f1
        grid: gn
        start_year: 1986
        end_year: 2005
        additional_datasets:
          - {dataset: ACCESS-ESM1-5}
          - {dataset: CanESM5}
          - {dataset: IPSL-CM6A-LR}
      volcello:
        mip: Ofx
        project: CMIP6
        exp: historical
        ensemble: r1i1p1f1
        grid: gn
        additional_datasets:
          - {dataset: ACCESS-ESM1-5}
    scripts:
      Drake-passage:
        script: russell18jgr/russell18jgr_fig4.py
        styleset: CMIP6
        max_vert: 2
        max_hori: 1
        unitCorrectionalFactor: 100
        new_units: cm/s
  Figure_5:
    description: |
      Sea ice extent above 15% concentration in September and March.
      March follows the legacy CMIP5 recipe; the paper uses February.
    themes:
      - seaIce
    realms:
      - seaIce
    variables:
      siconc:
        mip: SImon
        project: CMIP6
        exp: historical
        ensemble: r1i1p1f1
        grid: gn
        start_year: 1986
        end_year: 2005
        additional_datasets:
          - {dataset: ACCESS-ESM1-5}
          - {dataset: CanESM5}
          - {dataset: GFDL-ESM4}
          - {dataset: IPSL-CM6A-LR}
    scripts:
      sic-polar:
        script: russell18jgr/russell18jgr_fig5.py
        styleset: CMIP6
        max_lat: -45.0
        max_vert: 2
        max_hori: 2
  Figure_5g:
    description: Monthly climatology of Southern Hemisphere sea ice area.
    themes:
      - seaIce
    realms:
      - seaIce
    variables:
      siconc:
        mip: SImon
        project: CMIP6
        exp: historical
        ensemble: r1i1p1f1
        grid: gn
        start_year: 1986
        end_year: 2005
        additional_datasets:
