        project: CMIP6
        exp: historical
        ensemble: r1i1p1f1
        grid: gn
        start_year: 1986
        end_year: 2005
        additional_datasets:
          - {dataset: ACCESS-ESM1-5}
      so:
        mip: Omon
        project: CMIP6
        exp: historical
        ensemble: r1i1p1f1
        grid: gn
        start_year: 1986
        end_year: 2005
        additional_datasets:
          - {dataset: ACCESS-ESM1-5}
      vo:
        mip: Omon
        project: CMIP6
        exp: historical
        ensemble: r1i1p1f1
        grid: gn
        start_year: 1986
        end_year: 2005
        additional_datasets:
          - {dataset: ACCESS-ESM1-5}
      volcello:
        mip: Ofx
        project: CMIP6
        exp: historical
        ensemble: r1i1p1f1
        grid: gn
        additional_datasets:
          - {dataset: ACCESS-ESM1-5}
    scripts:
      Figure6a:
        script: russell18jgr/russell18jgr_fig6a.py
        styleset: CMIP6
  Figure_6b:
    description: |
      Density-layer heat transport across 30S from climatological fields,
      using the legacy fixed density and heat capacity. Velocity-temperature
      covariance and native face geometry are not resolved.
    themes:
      - phys
    realms:
      - ocean
    variables:
      thetao:
        mip: Omon
        project: CMIP6
        exp: historical
        ensemble: r1i1p1f1
        grid: gn
        start_year: 1986
        end_year: 2005
        additional_datasets:
          - {dataset: ACCESS-ESM1-5}
      so:
        mip: Omon
        project: CMIP6
        exp: historical
        ensemble: r1i1p1f1
        grid: gn
        start_year: 1986
        end_year: 2005
        additional_datasets:
          - {dataset: ACCESS-ESM1-5}
      vo:
        mip: Omon
        project: CMIP6
        exp: historical
        ensemble: r1i1p1f1
        grid: gn
        start_year: 1986
        end_year: 2005
        additional_datasets:
          - {dataset: ACCESS-ESM1-5}
      volcello:
        mip: Ofx
        project: CMIP6
        exp: historical
        ensemble: r1i1p1f1
