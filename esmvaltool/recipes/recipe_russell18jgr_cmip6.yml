        exp: historical
        ensemble: r1i1p1f1
        grid: gn
        additional_datasets:
          - {dataset: ACCESS-ESM1-5}
          - {dataset: CanESM5}
          - {dataset: GFDL-ESM4}
          - {dataset: IPSL-CM6A-LR}
    scripts:
      sic-line:
        script: russell18jgr/russell18jgr_fig5g.py
        styleset: CMIP6
  Figure_6a:
    description: |
      Density-layer volume transport across 30S, using the legacy
      calculation from climatological velocity, temperature and salinity
      and fixed cell volume. These are not mean monthly layer transports.
    themes:
      - phys
    realms:
      - ocean
    variables:
      thetao:
