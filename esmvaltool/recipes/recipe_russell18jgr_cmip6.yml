          - {dataset: CanESM5}
          - {dataset: GFDL-ESM4, grid: gr}
          - {dataset: IPSL-CM6A-LR}
    scripts:
      fgco2-polar:
        script: russell18jgr/russell18jgr_polar.py
        styleset: CMIP6
        grid_min: -30
        grid_max: 30
        grid_step: 2.5
        colormap: BlWhRe
        labelBar_end_type: both_triangle
        max_lat: -30.0
        max_vert: 2
        max_hori: 1
        unitCorrectionalFactor: -31540000000.0
        new_units: gC/ (m~S~2~N~ * yr)
  Figure_7h:
