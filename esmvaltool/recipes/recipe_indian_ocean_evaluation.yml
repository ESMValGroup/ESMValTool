  IO_atm_seas:
    extract_region:
      start_longitude: 50
      end_longitude: 110 
      start_latitude: -10
      end_latitude: 10
    extract_levels:     ## Can't use uas as no matching obs for this variable
      levels: [100000.]
      scheme: linear
    climate_statistics:
      operator: mean
      period: season
    regrid:
      target_grid: 1x1
      scheme: linear
  IO_atm_annual:
    extract_region:
      start_longitude: 50
      end_longitude: 110 
      start_latitude: -10
      end_latitude: 10
    extract_levels:     ## Can't use uas as no matching obs for this variable
