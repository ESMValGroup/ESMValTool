preprocessors:
  west_pole_abs_son:
    extract_region:
      start_longitude: 50
      end_longitude: 70
      start_latitude: -10
      end_latitude: 10
    area_statistics:
      operator: mean
    climate_statistics:
      operator: mean
      period: season
    extract_season:
      season: SON
    convert_units:
      units: celsius    
  east_pole_abs_son:
    extract_region:
      start_longitude: 90
      end_longitude: 110
      start_latitude: -10
      end_latitude: 0
    area_statistics:
      operator: mean
    climate_statistics:
      operator: mean
      period: season
    extract_season:
      season: SON
    convert_units:
      units: celsius  
  IO_abs_seas:
    extract_region:
      start_longitude: 50
      end_longitude: 110
      start_latitude: -10
      end_latitude: 10
    climate_statistics:
      operator: mean
      period: season
    convert_units:
      units: celsius  
    regrid:
      target_grid: 1x1
      scheme: linear
  IO_abs_annual:
    extract_region:
      start_longitude: 50
      end_longitude: 110
      start_latitude: -10
      end_latitude: 10
    climate_statistics:
      operator: mean
      period: full
    convert_units:
      units: celsius 
    regrid:
      target_grid: 1x1
      scheme: linear 
  IO_abs_seas_3d:
    extract_region:
      start_longitude: 50
      end_longitude: 110
      start_latitude: -10
      end_latitude: 10
    extract_volume:
      z_min: 0.
      z_max: 200.
      interval_bounds: 'closed'
    climate_statistics:
      operator: mean
      period: season
    convert_units:
      units: celsius  
    regrid:
      target_grid: 1x1
      scheme: linear
  IO_abs_annual_3d:
    extract_region:
      start_longitude: 50
      end_longitude: 110
      start_latitude: -10
      end_latitude: 10
    extract_volume:
      z_min: 0.
      z_max: 200.
      interval_bounds: 'closed'
    climate_statistics:
      operator: mean
      period: full
    convert_units:
      units: celsius 
    regrid:
      target_grid: 1x1
      scheme: linear 
  east_pole_monthly:
    extract_region:
      start_longitude: 90
      end_longitude: 110
      start_latitude: -10
      end_latitude: 0
    area_statistics:
      operator: mean
    climate_statistics:
      operator: mean
      period: month
    convert_units:
      units: celsius  
  eio_monthly:
    extract_region:
      start_longitude: 42
      end_longitude: 100
      start_latitude: -5
      end_latitude: 5
    climate_statistics:
      operator: mean
      period: month
    convert_units:
      units: celsius  
    regrid:
      target_grid: 1x1
      scheme: linear
  eio_monthly_3d:
    extract_region:
      start_longitude: 42
      end_longitude: 100
      start_latitude: -5
      end_latitude: 5
    extract_volume:
      z_min: 0.
      z_max: 200.
      interval_bounds: 'closed'
    climate_statistics:
      operator: mean
      period: month
    regrid:
      target_grid: 1x1
      scheme: linear
    convert_units:
      units: celsius 
  west_pole_monthly:
    extract_region:
      start_longitude: 50
      end_longitude: 70
      start_latitude: -10
      end_latitude: 10
    area_statistics:
      operator: mean
    climate_statistics:
      operator: mean
      period: month
    convert_units:
      units: celsius  
  east_pole_anomalies_son_ts:
    extract_region:
      start_longitude: 90
      end_longitude: 110
      start_latitude: -10
      end_latitude: 0
    anomalies:
      period: month
      reference:
        start_year: 1990
        start_month: 1
        start_day: 1
        end_year: 2010
        end_month: 12
        end_day: 31
      standardize: false    
    area_statistics:
      operator: mean
    extract_season:
      season: SON
  west_pole_anomalies_son_ts:
    extract_region:
      start_longitude: 50
      end_longitude: 70
      start_latitude: -10
      end_latitude: 10
    anomalies:
      period: month
      reference:
        start_year: 1990
        start_month: 1
        start_day: 1
        end_year: 2010
        end_month: 12
        end_day: 31
      standardize: false    
    area_statistics:
      operator: mean
    extract_season:
      season: SON
