documentation:
  title: CORDEX-CMIP5 maps
  description: This is a recipe that generates maps for CORDEX-CMIP5 models.
  authors:
    - loosveldt-tomas_saskia
    - andela_bouwe
    - ghosh_supriyo
  maintainer:
    - ghosh_supriyo
    - andela_bouwe

preprocessors:
  default:
    custom_order: true
    monthly_statistics:
      operator: mean
    climate_statistics:
      operator: mean
      period: full
  land:
    custom_order: true
    monthly_statistics:
      operator: mean
    climate_statistics:
      operator: mean
      period: full
    mask_landsea:
      mask_out: sea
    convert_units:
      units: degC
  sea:
    custom_order: true
    monthly_statistics:
      operator: mean
    climate_statistics:
      operator: mean
      period: full
    mask_landsea:
      mask_out: land
    convert_units:
      units: degC

datasets:
  - {dataset: HIRHAM5, driver: CNRM-CERFACS-CNRM-CM5, ensemble: r1i1p1, institute: DMI, rcm_version: v2}
  - {dataset: HIRHAM5, driver: ICHEC-EC-EARTH, ensemble: r1i1p1, institute: DMI, rcm_version: v1}
  - {dataset: HIRHAM5, driver: ICHEC-EC-EARTH, ensemble: r3i1p1, institute: DMI, rcm_version: v2}
