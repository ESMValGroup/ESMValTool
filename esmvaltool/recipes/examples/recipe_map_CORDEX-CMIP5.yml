  - {dataset: HIRHAM5, driver: NCC-NorESM1-M, ensemble: r1i1p1, institute: DMI, rcm_version: v3}
  - {dataset: HadREM3-GA7-05, driver: CNRM-CERFACS-CNRM-CM5, ensemble: r1i1p1, institute: MOHC, rcm_version: v2}
  - {dataset: HadREM3-GA7-05, driver: ICHEC-EC-EARTH, ensemble: r12i1p1, institute: MOHC, rcm_version: v1}
