documentation:
  title: CORDEX-CMIP6 EUR-12 maps
  description: >
    Climatology maps for EUR-12 CORDEX-CMIP6 historical simulations and
    the bias against ESA CCI references for 2003-2005. Variable groups
    match recipe_perfmetrics_CORDEX-CMIP6_EUR-12.yml.
  authors:
    - ghosh_supriyo
  maintainer:
    - ghosh_supriyo

preprocessors:
  default:
    custom_order: true
    monthly_statistics:
      operator: mean
    climate_statistics:
      operator: mean
      period: full
    regrid:
      scheme: linear
      target_grid: EUR-12
    multi_model_statistics:
      exclude:
        - reference_dataset
      span: overlap
      statistics:
        - operator: mean
        - operator: median
  land:
    custom_order: true
    monthly_statistics:
      operator: mean
    climate_statistics:
      operator: mean
      period: full
    mask_landsea:
      mask_out: sea
    regrid:
      scheme: linear
      target_grid: EUR-12
    convert_units:
      units: degC
    multi_model_statistics:
      exclude:
        - reference_dataset
      span: overlap
      statistics:
        - operator: mean
        - operator: median
  sea:
    custom_order: true
    monthly_statistics:
      operator: mean
    climate_statistics:
      operator: mean
      period: full
    mask_landsea:
      mask_out: land
    regrid:
      scheme: linear
      target_grid: EUR-12
    convert_units:
      units: degC
    multi_model_statistics:
      exclude:
        - reference_dataset
      span: overlap
      statistics:
        - operator: mean
        - operator: median

datasets:
  - {dataset: ICON-CLM-202407-1-1, driver: CNRM-ESM2-1, ensemble: r1i1p1f2, institute: CLMcom-BTU, alias: ICON-CLM-202407-1-1_CNRM-ESM2-1, use_standard_grid: true}
  - {dataset: ICON-CLM-202407-1-1, driver: MPI-ESM1-2-HR, institute: CLMcom-DWD, alias: ICON-CLM-202407-1-1_MPI-ESM1-2-HR}
  - {dataset: ICON-CLM-202407-1-3, driver: NorESM2-MM, institute: CLMcom-ETH, alias: ICON-CLM-202407-1-3_NorESM2-MM}
  - {dataset: ICON-CLM-202407-1-1, driver: EC-Earth3-Veg, institute: CLMcom-Hereon, alias: ICON-CLM-202407-1-1_EC-Earth3-Veg}
  - {dataset: CCLM6-0-1, driver: EC-Earth3-Veg, institute: CLMcom-KIT, alias: CCLM6-0-1_EC-Earth3-Veg}
  - {dataset: CCLM6-0-1, driver: MIROC6, institute: CLMcom-KIT, alias: CCLM6-0-1_MIROC6}
  - {dataset: ICON-CLM-202407-1-1, driver: MIROC6, institute: CLMcom-KIT, alias: ICON-CLM-202407-1-1_MIROC6}
  - {dataset: ICON-CLM-202407-1-1, driver: CMCC-CM2-SR5, institute: CLMcom-WEGC, alias: ICON-CLM-202407-1-1_CMCC-CM2-SR5}
  - {dataset: CNRM-ALADIN64E1, driver: CMCC-CM2-SR5, institute: CNRM-MF, alias: CNRM-ALADIN64E1_CMCC-CM2-SR5}
  - {dataset: CNRM-ALADIN64E1, driver: NorESM2-MM, institute: CNRM-MF, alias: CNRM-ALADIN64E1_NorESM2-MM}
  # clivi download from esgf.ipsl.fr timed out (200101-201012)
  # - {dataset: CNRM-ALADIN64E1, driver: CNRM-ESM2-1, ensemble: r1i1p1f2, institute: CNRM-MF, alias: CNRM-ALADIN64E1_CNRM-ESM2-1}

diagnostics:
  clivi:
    additional_datasets:
      - {dataset: ESACCI-CLOUD, mip: Amon, project: OBS6, reference_for_monitor_diags: true, tier: 2, type: sat, version: v3.0-AVHRR-AMPM}
    variables:
      clivi:
        activity: DD
        domain: EUR-12
        ensemble: r1i1p1f1
        exp: historical
        mip: mon
        preprocessor: default
        project: CORDEX-CMIP6
        rcm_version: v1-r1
        reference_dataset: ESACCI-CLOUD
        timerange: 2003/2005
    scripts:
      plot:
        script: monitor/multi_datasets.py
        facet_used_for_labels: alias
        plot_filename: '{plot_type}_{variable_group}_{alias}_{mip}'
        plot_folder: '{plot_dir}'
        plots:
          map:
            common_cbar: false
            fontsize: 6
  clt:
    additional_datasets:
      - {dataset: ESACCI-CLOUD, mip: day, project: OBS6, reference_for_monitor_diags: true, tier: 2, type: sat, version: v3.0-AVHRR-AMPM}
      - {dataset: HCLIM43-ALADIN, driver: NorESM2-MM, institute: HCLIMcom-METNo, alias: HCLIM43-ALADIN_NorESM2-MM}
      - {dataset: HCLIM43-ALADIN, driver: CNRM-ESM2-1, ensemble: r1i1p1f2, institute: HCLIMcom-SMHI, alias: HCLIM43-ALADIN_CNRM-ESM2-1}
