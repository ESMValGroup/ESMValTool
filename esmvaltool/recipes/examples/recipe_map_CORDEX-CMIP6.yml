      - {dataset: HCLIM43-ALADIN, driver: EC-Earth3-Veg, ensemble: r3i1p1f1, institute: HCLIMcom-SMHI, alias: HCLIM43-ALADIN_EC-Earth3-Veg_r3}
      - {dataset: HCLIM43-ALADIN, driver: MPI-ESM1-2-HR, institute: HCLIMcom-SMHI, alias: HCLIM43-ALADIN_MPI-ESM1-2-HR}
      - {dataset: HCLIM43-ALADIN, driver: MIROC6, institute: HCLIMcom-SMHI, alias: HCLIM43-ALADIN_MIROC6}
    variables:
      clt:
        activity: DD
        domain: EUR-12
        ensemble: r1i1p1f1
        exp: historical
        mip: mon
        preprocessor: default
        project: CORDEX-CMIP6
        rcm_version: v1-r1
        reference_dataset: ESACCI-CLOUD
        timerange: 2003/2005
    scripts:
      plot:
        script: monitor/multi_datasets.py
        facet_used_for_labels: alias
