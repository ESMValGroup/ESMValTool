          #     [-2.0, 2.0],
          #     [-2.0, 2.0],
          #   ],
          # ]
        colormap_range_histogram: [-1.0, 1.0] # optional
        regions:
          - { name: tropics, lat_min: -30, lat_max: 30 }
          - { name: northern_midlatitudes, lat_min: 30, lat_max: 60 }
          - { name: southern_midlatitudes, lat_min: -60, lat_max: -30 }
          - { name: high_latitudes_nh, lat_min: 60, lat_max: 90 }
          - { name: high_latitudes_sh, lat_min: -90, lat_max: -60 }
