# Copy the site specific environment files and configuration
# to the 'share' directory in the installed Cylc workflow
# (the 'share/bin' directory is automatically added to the ${PATH} by Cylc).
#
# BASH_XTRACEFD=1 sends the output from 'set -x'
# to 'stdout' rather than 'stderr'.

[command]
default=BASH_XTRACEFD=1
       =set -euxo pipefail
       =cp ${ENV_FILE_SITE_PATH} ${SHARE_BIN_DIR}/
       =cp ${SINGULARITY_ENV_FILE_SITE_PATH} ${SHARE_BIN_DIR}/
       =cp ${SITE_CONFIG_PATH}/*.yml ${SITE_CONFIG_DIR}/

[file:${SHARE_BIN_DIR}]
mode=mkdir

[file:${SITE_CONFIG_DIR}]
mode=mkdir
