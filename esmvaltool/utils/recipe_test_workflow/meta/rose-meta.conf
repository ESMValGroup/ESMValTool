[template variables=DATA_SOURCES_FILE]
compulsory=false
description=The name of the example configuration file provided by ESMValCore
           =that defines the data sources for the site.
help=Use 'esmvaltool config list' to list the available files. Leave this empty
    =if the data sources are defined in the 'site/<site>/config' directory.
type=quoted

[template variables=ENV_NAME]
compulsory=false
description=The name of the environment (module or container label) to load for
           =the RTW.
help=This value must be set in a site-specific configuration file located in
    =the 'opt/' directory.
type=quoted

[template variables=KGO_ROOT_PATH]
compulsory=false
description=The full path to the directory containing the Known Good Outputs
           =(KGOs).
help=This value must be set in a site-specific configuration file located in
    =the 'opt/' directory.
type=quoted

[template variables=MAX_PARALLEL_TASKS]
compulsory=true
description=The number of tasks (within a single call to ESMValTool) to run in
           =parallel when running ESMValTool.
help=To override the default value for a specific site, define the override
    =value in a site-specific configuration file located in the 'opt/'
    =directory.
type=integer

[template variables=PRODUCTION]
compulsory=true
description=Whether to run the RTW in production mode.
help=To override the default value for a specific site, define the override
    =value in a site-specific configuration file located in the 'opt/'
    =directory. Production mode is only possible for DKRZ.
type=quoted

[template variables=SITE]
compulsory=true
description=The site at which the Rose suite will run.
help=This value must be set in a site-specific configuration file located in
    =the 'opt/' directory.
type=quoted
