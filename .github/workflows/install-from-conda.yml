---
name: Install from Conda

permissions: {}

# runs on a push on main and at the end of every day
on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 4 * * *"

# Required shell entrypoint to have properly configured bash shell
defaults:
  run:
    shell: bash -l {0}

jobs:
  esmvaltool-python:
    runs-on: ${{ matrix.os }}
    if: github.repository == 'ESMValGroup/ESMValTool' # avoid GAs in forks
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
        python-version:
          - "3.12"
          - "3.13"
          - "3.14"
    name: Install esmvaltool-python with Python ${{ matrix.python-version }} on ${{ matrix.os }}
    steps:
      - uses: mamba-org/setup-micromamba@ce51e99f4bb8a82ab7158c4dc59ef4634c59c4f9  # v3.1.0
        with:
          environment-name: esmvaltool-python
          create-args: >-
            python=${{ matrix.python-version }}
            esmvaltool-python
      - name: Verify installation
        run: |
          pip check
          esmvaltool --help
          esmvaltool version
          esmvaltool recipes list
  esmvaltool:
    runs-on: "ubuntu-latest"
    if: github.repository == 'ESMValGroup/ESMValTool' # avoid GAs in forks
    name: Install esmvaltool on Linux
    steps:
      - uses: mamba-org/setup-micromamba@ce51e99f4bb8a82ab7158c4dc59ef4634c59c4f9  # v3.1.0
        with:
          environment-name: esmvaltool
          create-args: esmvaltool
      - name: Verify installation
        run: |
          pip check
          esmvaltool --help
          esmvaltool version
          esmvaltool recipes list
